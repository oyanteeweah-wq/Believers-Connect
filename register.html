<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1b2a">
<title>Believers+ - Create Account</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="auth-page">
  <div class="auth">

    <div class="auth-brand">
      <div class="auth-logo">✝</div>

      <div class="brand">
        Believers<span>+</span>
      </div>

      <div style="font-size:13px;opacity:.8;margin-top:4px">
        Connecting Believers Worldwide
      </div>
    </div>

    <div class="auth-card">

      <h3 style="font-size:18px;font-weight:800;margin-bottom:16px;color:var(--bp-primary)">
        Create Account
      </h3>

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          id="regFullName"
          placeholder="Your full name">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          id="regEmail"
          placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          id="regPassword"
          placeholder="Minimum 6 characters">
      </div>

      <button
        class="btn btn-gold"
        id="btnRegister"
        type="button">
        Create Account
      </button>

      <div id="regMsg" class="msg-error"></div>

      <div class="divider"></div>

      <div style="text-align:center">

        <span style="font-size:13px;color:var(--bp-muted)">
          Already have an account?
        </span>

        <a
          href="login.html"
          style="font-size:13px;font-weight:800;color:var(--bp-primary);margin-left:4px;text-decoration:none">
          Log In
        </a>

      </div>

    </div>
  </div>
</div>

<script src="supabase.js"></script>
<script src="auth.js"></script>

</body>
</html>
