<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Friends - Believer Connect</title>

<link rel="stylesheet" href="style.css">

<style>
/* Friends page */
.friends-page {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 15px;
}

.friends-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.friends-header h1 {
    margin: 0;
    font-size: 28px;
}

.back-btn {
    text-decoration: none;
    color: #0756d9;
    font-weight: 600;
}

.friends-tabs {
    display: flex;
    gap: 10px;
    border-bottom: 1px solid #ddd;
    margin-bottom: 20px;
}

.friends-tab {
    border: none;
    background: transparent;
    padding: 12px 15px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    color: #666;
}

.friends-tab.active {
    color: #0756d9;
    border-bottom: 3px solid #0756d9;
}

.friends-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.friend-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.friend-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.friend-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    background: #e9eef7;
    flex-shrink: 0;
}

.friend-details {
    min-width: 0;
}

.friend-name {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 700;
    color: #222;
}

.friend-status {
    margin: 0;
    font-size: 13px;
    color: #777;
}

.friend-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.friend-btn {
    border: none;
    border-radius: 8px;
    padding: 9px 13px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
}

.primary-btn {
    background: #0756d9;
    color: white;
}

.secondary-btn {
    background: #edf2f8;
    color: #333;
}

.danger-btn {
    background: #ffe8e8;
    color: #d60000;
}

.empty-state {
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

.empty-state h3 {
    margin-bottom: 8px;
    color: #333;
}

.loading {
    text-align: center;
    padding: 40px;
    color: #777;
}

@media (max-width: 600px) {
    .friends-page {
        padding: 15px 10px;
    }

    .friends-header h1 {
        font-size: 24px;
    }

    .friend-card {
        padding: 12px;
    }

    .friend-avatar {
        width: 46px;
        height: 46px;
    }

    .friend-actions {
        flex-direction: column;
    }

    .friend-btn {
        padding: 8px 10px;
    }
}
</style>
</head>

<body>

<div class="friends-page">

    <div class="friends-header">
        <h1>Friends</h1>
        <a href="index.html" class="back-btn">← Home</a>
    </div>

    <div class="friends-tabs">
        <button class="friends-tab active" data-tab="friends">
            My Friends
        </button>

        <button class="friends-tab" data-tab="requests">
            Requests
        </button>

        <button class="friends-tab" data-tab="suggestions">
            Suggestions
        </button>
    </div>

    <div id="friendsContent">

        <div id="friendsTab" class="friends-section">
            <div id="friendsList" class="friends-list">
                <div class="loading">Loading friends...</div>
            </div>
        </div>

        <div id="requestsTab" class="friends-section" style="display:none;">
            <div id="requestsList" class="friends-list">
                <div class="loading">Loading requests...</div>
            </div>
        </div>

        <div id="suggestionsTab" class="friends-section" style="display:none;">
            <div id="suggestionsList" class="friends-list">
                <div class="loading">Loading suggestions...</div>
            </div>
        </div>

    </div>

</div>

<script src="supabase.js"></script>
<script src="auth.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const tabs = document.querySelectorAll(".friends-tab");

    tabs.forEach(tab => {
        tab.addEventListener("click", function () {

            tabs.forEach(t => t.classList.remove("active"));
            this.classList.add("active");

            document.querySelectorAll(".friends-section")
                .forEach(section => section.style.display = "none");

            const selected = this.dataset.tab;

            if (selected === "friends") {
                document.getElementById("friendsTab").style.display = "block";
                loadFriends();
            }

            if (selected === "requests") {
                document.getElementById("requestsTab").style.display = "block";
                loadRequests();
            }

            if (selected === "suggestions") {
                document.getElementById("suggestionsTab").style.display = "block";
                loadSuggestions();
            }
        });
    });

    loadFriends();
});


async function getCurrentUser() {
    try {

        if (typeof supabaseClient !== "undefined") {
            const { data } = await supabaseClient.auth.getUser();
            return data?.user || null;
        }

        if (typeof supabase !== "undefined" && supabase.auth) {
            const { data } = await supabase.auth.getUser();
            return data?.user || null;
        }

    } catch (error) {
        console.error("User error:", error);
    }

    return null;
}


function friendCard(user, buttonText = "View Profile", buttonClass = "primary-btn") {

    const name =
        user.full_name ||
        user.name ||
        user.username ||
        "Believer";

    const avatar =
        user.avatar_url ||
        user.profile_picture ||
        user.photo ||
        "https://ui-avatars.com/api/?name=" +
        encodeURIComponent(name);

    return `
        <div class="friend-card">

            <div class="friend-info">

                <img
                    class="friend-avatar"
                    src="${avatar}"
                    alt="${name}"
                    onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(name)}'"
                >

                <div class="friend-details">
                    <p class="friend-name">${escapeHTML(name)}</p>
                    <p class="friend-status">Believer Connect member</p>
                </div>

            </div>

            <div class="friend-actions">

                <button
                    class="friend-btn ${buttonClass}"
                    onclick="viewProfile('${user.id || ""}')"
                >
                    ${buttonText}
                </button>

            </div>

        </div>
    `;
}


function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}


function viewProfile(userId) {

    if (!userId) {
        return;
    }

    window.location.href =
        "profile.html?id=" + encodeURIComponent(userId);
}


async function loadFriends() {

    const container = document.getElementById("friendsList");

    container.innerHTML =
        '<div class="loading">Loading friends...</div>';

    try {

        const user = await getCurrentUser();

        if (!user) {
            container.innerHTML = `
                <div class="empty-state">
                    <h3>Please log in</h3>
                    <p>You need to be logged in to see your friends.</p>
                    <a href="login.html" class="friend-btn primary-btn">
                        Login
                    </a>
                </div>
            `;
            return;
        }

        /*
         * Friends will be loaded from Supabase
         * when your friendship table is available.
         *
         * This page is intentionally kept separate from
         * your other files.
         */

        container.innerHTML = `
            <div class="empty-state">
                <h3>No friends yet</h3>
                <p>
                    When you connect with other believers,
                    your friends will appear here.
                </p>
            </div>
        `;

    } catch (error) {

        console.error("Friends error:", error);

        container.innerHTML = `
            <div class="empty-state">
                <h3>Unable to load friends</h3>
                <p>Please try again.</p>
            </div>
        `;
    }
}


async function loadRequests() {

    const container = document.getElementById("requestsList");

    container.innerHTML = `
        <div class="empty-state">
            <h3>No friend requests</h3>
            <p>New friend requests will appear here.</p>
        </div>
    `;
}


async function loadSuggestions() {

    const container = document.getElementById("suggestionsList");

    container.innerHTML = `
        <div class="empty-state">
            <h3>Friend suggestions</h3>
            <p>
                People you may know on Believer Connect
                will appear here.
            </p>
        </div>
    `;
}
</script>

</body>
</html>
