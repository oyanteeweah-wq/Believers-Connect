<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1b2a">
<title>Believers+ - Log In</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="auth-page">
  <div class="auth">
    <div class="auth-brand">
      <div class="auth-logo">✝</div>
      <div class="brand">Believers<span>+</span></div>
      <div style="font-size:13px;opacity:.8;margin-top:4px">
        Connecting Believers Worldwide
      </div>
    </div>

    <div class="auth-card">
      <h3 style="font-size:18px;font-weight:800;margin-bottom:16px;color:var(--bp-primary)">
        Log In
      </h3>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••">
      </div>

      <button class="btn btn-gold" id="btnLogin" type="button">
        Log In
      </button>

      <div id="loginMsg" class="msg-error"></div>

      <div class="divider"></div>

      <div style="text-align:center">
        <span style="font-size:13px;color:var(--bp-muted)">
          Don't have an account?
        </span>

        <a href="register.html"
           style="font-size:13px;font-weight:800;color:var(--bp-primary);margin-left:4px;text-decoration:none">
          Create New Account
        </a>
      </div>
    </div>
  </div>
</div>

<script src="supabase.js"></script>
<script src="auth.js"></script>

</body>
</html>
