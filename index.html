<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1b2a">
<title>Believers+</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =========================================================
   ORIGINAL BELIEVERS+ DESIGN SYSTEM & THEME
========================================================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

:root {
  --bp-primary: #0d1b2a;       /* Deep Sapphire */
  --bp-accent: #1b263b;        /* Midnight Blue */
  --bp-gold: #e0a96d;          /* Radiant Gold */
  --bp-gold-hover: #c89355;
  --bp-bg: #f4f6f9;            /* Soft Pearl White */
  --bp-card-bg: #ffffff;
  --bp-text: #1b1e23;
  --bp-muted: #6c757d;
  --bp-icon-bg: #e9ecef;
  --bp-border: #e2e8f0;
  --bp-radius: 14px;
  --bp-shadow: 0 4px 12px rgba(13, 27, 42, 0.05);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bp-bg);
  color: var(--bp-text);
  line-height: 1.5;
  padding-bottom: 70px;
}

button, input, textarea, select {
  font: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

img, video {
  max-width: 100%;
  display: block;
}

.hidden {
  display: none !important;
}

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

/* =========================================================
   AUTHENTICATION VIEW
========================================================= */
.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
  color: white;
}

.auth {
  width: 100%;
  max-width: 410px;
}

.auth-brand {
  text-align: center;
  margin-bottom: 24px;
}

.auth-logo {
  font-size: 52px;
  color: var(--bp-gold);
  margin-bottom: 4px;
}

.brand {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: white;
}

.brand span {
  color: var(--bp-gold);
}

.auth-card {
  background: white;
  border-radius: 18px;
  padding: 24px;
  color: var(--bp-text);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--bp-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--bp-border);
  border-radius: 10px;
  background: #f8fafc;
  outline: none;
  transition: border-color 0.2s;
  color: var(--bp-text);
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--bp-gold);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: 10px;
  background: var(--bp-primary);
  color: white;
  font-weight: 700;
  width: 100%;
  font-size: 15px;
  transition: opacity 0.2s;
}

.btn:active {
  opacity: 0.9;
}

.btn-gold {
  background: var(--bp-gold);
  color: var(--bp-primary);
}

.btn-gold:hover {
  background: var(--bp-gold-hover);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--bp-border);
  color: var(--bp-primary);
}

.divider {
  height: 1px;
  background: var(--bp-border);
  margin: 18px 0;
}

.msg-error {
  color: #e63946;
  margin-top: 10px;
  font-size: 13px;
  text-align: center;
  font-weight: 600;
}

/* =========================================================
   HEADER & NAVIGATION
========================================================= */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.header-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.logo-icon {
  font-size: 22px;
  color: var(--bp-gold);
}

.logo {
  font-size: 22px;
  font-weight: 900;
  color: var(--bp-primary);
  letter-spacing: -0.5px;
}

.logo span {
  color: var(--bp-gold);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}

.header-circle-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bp-icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--bp-primary);
  transition: background 0.2s;
  position: relative;
}

/* =========================================================
   HEADER MENU DROPDOWN
========================================================= */
.menu-dropdown {
  position: absolute;
  top: 48px;
  right: 0;
  width: 210px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border: 1px solid var(--bp-border);
  z-index: 1001;
  overflow: hidden;
}

.menu-item {
  width: 100%;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 700;
  color: #e63946;
  background: white;
  text-align: left;
  transition: background 0.2s;
}

.menu-item:hover {
  background: #f8fafc;
}

.nav-wrap {
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
}

.nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  max-width: 640px;
  margin: 0 auto;
}

.nav button {
  flex: 1;
  padding: 12px 0;
  font-size: 18px;
  color: var(--bp-muted);
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: color 0.2s;
}

.nav button.active {
  color: var(--bp-gold);
  border-bottom: 3px solid var(--bp-gold);
}

/* =========================================================
   SEARCH BAR & NOTIFICATIONS
========================================================= */
.search-modal-box {
  background: white;
  padding: 12px 16px;
  border-bottom: 1px solid var(--bp-border);
}

.search-input-wrapper {
  display: flex;
  align-items: center;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  border-radius: 20px;
  padding: 8px 14px;
  gap: 10px;
}

.search-input-wrapper input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 14px;
}

/* =========================================================
   COMPOSER / WHAT IS ON YOUR HEART TODAY
========================================================= */
.composer-card {
  background: var(--bp-card-bg);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
  margin-bottom: 10px;
  border-radius: var(--bp-radius);
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid var(--bp-gold);
  cursor: pointer;
  background-size: cover;
  background-position: center;
}

.mind-button {
  flex: 1;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  border-radius: 25px;
  padding: 10px 16px;
  color: var(--bp-muted);
  font-size: 14px;
  text-align: left;
}

.photo-upload-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--bp-gold);
  font-size: 18px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  background: #fff8f0;
}

.photo-upload-btn span {
  font-size: 12px;
  color: var(--bp-primary);
  font-weight: 700;
}

#postComposerArea {
  background: white;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.composer-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 15px;
  resize: none;
  min-height: 85px;
}

.composer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--bp-border);
  padding-top: 10px;
}

.composer-preview-box {
  position: relative;
  margin: 10px 0;
  background: #f8fafc;
  border-radius: 10px;
  border: 1px solid var(--bp-border);
  overflow: hidden;
  max-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.composer-preview-box img,
.composer-preview-box video {
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  display: block;
}

.remove-media-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(13, 27, 42, 0.75);
  color: white;
  border: none;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  backdrop-filter: blur(4px);
  transition: background 0.2s;
}

.remove-media-btn:hover {
  background: rgba(230, 57, 70, 0.9);
}

/* =========================================================
   COMMUNITY UPDATES / STORIES
========================================================= */
.stories-container {
  background: transparent;
  margin-bottom: 12px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  padding: 2px 0;
}

.stories-container::-webkit-scrollbar {
  display: none;
}

.stories-wrapper {
  display: inline-flex;
  gap: 10px;
}

.story-card {
  width: 110px;
  height: 175px;
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  background: var(--bp-primary);
  flex-shrink: 0;
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
  cursor: pointer;
}

.story-card img.bg-story {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}

.story-card .story-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(13, 27, 42, 0.9) 0%, transparent 60%);
}

.story-card .story-author {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  color: white;
  font-size: 11px;
  font-weight: 700;
  white-space: normal;
  line-height: 1.2;
}

.story-card.create-story {
  background: white;
  display: flex;
  flex-direction: column;
}

.story-card.create-story .top-img {
  height: 115px;
  width: 100%;
  position: relative;
  background: #f1f5f9;
  background-size: cover;
  background-position: center;
}

.story-card.create-story .plus-btn {
  position: absolute;
  bottom: -13px;
  left: 50%;
  transform: translateX(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bp-gold);
  color: var(--bp-primary);
  border: 2px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.story-card.create-story .bottom-text {
  height: 60px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-size: 11px;
  font-weight: 800;
  color: var(--bp-primary);
  text-align: center;
}

/* =========================================================
   FEED POST CARDS & ACTIONS
========================================================= */
.card {
  background: var(--bp-card-bg);
  margin-bottom: 12px;
  padding: 14px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.posthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.posthead-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-author-name {
  font-weight: 800;
  font-size: 14px;
  color: var(--bp-primary);
}

.post-meta-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--bp-muted);
}

.post-content {
  font-size: 14px;
  margin-bottom: 10px;
  white-space: pre-wrap;
}

.post-media-attachment {
  width: 100%;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
  background: #000;
}

.post-media-attachment img,
.post-media-attachment video {
  width: 100%;
  max-height: 450px;
  object-fit: contain;
  display: block;
}

.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--bp-border);
  padding-top: 8px;
  margin-top: 4px;
  gap: 4px;
}

.action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 4px;
  color: var(--bp-muted);
  font-size: 13px;
  font-weight: 700;
  border-radius: 6px;
  transition: color 0.2s, background 0.2s;
  white-space: nowrap;
}

.action-btn:hover {
  background: #f8fafc;
}

.action-btn.liked {
  color: #e63946;
}

.comments-section {
  margin-top: 10px;
  border-top: 1px dashed var(--bp-border);
  padding-top: 10px;
}

.comments-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  max-height: 200px;
  overflow-y: auto;
}

.comment-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  background: #f8fafc;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--bp-border);
}

.comment-author {
  font-weight: 800;
  color: var(--bp-primary);
  font-size: 12px;
}

.comment-text {
  color: var(--bp-text);
  margin-top: 2px;
  word-break: break-word;
}

.comment-input-wrap {
  display: flex;
  gap: 8px;
  align-items: center;
}

.comment-input-wrap input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--bp-border);
  border-radius: 20px;
  outline: none;
  font-size: 13px;
  background: #f8fafc;
}

.comment-input-wrap input:focus {
  border-color: var(--bp-gold);
}

/* =========================================================
   FRIENDS, GROUPS & PROFILE MODULES
========================================================= */
.friends-list, .groups-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.friend-card, .group-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 12px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.friend-info, .group-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 8px;
  font-weight: 700;
}

.profile-card {
  background: white;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
  overflow: hidden;
  margin-bottom: 12px;
  position: relative;
}

.profile-cover-area {
  height: 140px;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  background-size: cover;
  background-position: center;
  position: relative;
}

.profile-header-content {
  padding: 0 16px 16px 16px;
  text-align: center;
  position: relative;
  margin-top: -40px;
}

.profile-avatar-wrapper {
  position: relative;
  width: 84px;
  height: 84px;
  margin: 0 auto 8px auto;
}

.profile-avatar-large {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 32px;
  border: 3px solid white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

.about-me-card {
  background: white;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
  padding: 16px;
  margin-bottom: 12px;
}

.about-me-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--bp-border);
}

.about-me-title {
  font-weight: 800;
  font-size: 16px;
  color: var(--bp-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.profile-field-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px dashed #edf2f7;
}

.profile-field-item:last-child {
  border-bottom: none;
}

.profile-field-icon {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: #f8fafc;
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.profile-field-content label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  color: var(--bp-muted);
  text-transform: uppercase;
}

.profile-field-content div {
  font-size: 14px;
  font-weight: 600;
  color: var(--bp-primary);
  margin-top: 2px;
}
</style>
</head>
<body>

  <!-- ================= HEADER SECTION ================= -->
  <header>
    <div class="header-inner">
      <div class="logo-area" onclick="switchTab('feed')">
        <i class="fa-solid fa-dove logo-icon"></i>
        <div class="logo">Believers<span>+</span></div>
      </div>
      
      <div class="header-actions">
        <!-- Menu Button & Dropdown -->
        <button class="header-circle-btn" id="menuToggleBtn" title="Menu" onclick="toggleHeaderMenu(event)">
          <i class="fa-solid fa-bars"></i>
        </button>
        
        <div id="headerMenuDropdown" class="menu-dropdown hidden">
          <button class="menu-item" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout / Exit
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Bar (Hidden when logged out) -->
  <div id="navWrap" class="nav-wrap hidden">
    <nav class="nav">
      <button id="navFeed" class="active" onclick="switchTab('feed')"><i class="fa-solid fa-house"></i></button>
      <button id="navFriends" onclick="switchTab('friends')"><i class="fa-solid fa-user-group"></i></button>
      <button id="navGroups" onclick="switchTab('groups')"><i class="fa-solid fa-users-rectangle"></i></button>
      <button id="navProfile" onclick="switchTab('profile')"><i class="fa-solid fa-user"></i></button>
    </nav>
  </div>

  <!-- ================= MAIN CONTENT CONTAINER ================= -->
  <main class="wrap" id="mainContent">
    <!-- Dynamic views render here -->
  </main>

  <script>
    /* =========================================================
       APPLICATION STATE & MOCK DATA
    ========================================================= */
    let currentUser = JSON.parse(localStorage.getItem('bp_user')) || null;
    let currentTab = 'feed';
    let composerMedia = null; // { type: 'image'|'video', url: string }

    let posts = JSON.parse(localStorage.getItem('bp_posts')) || [
      {
        id: 1,
        author: 'Pastor Samuel',
        avatar: '',

        content: 'Faith is taking the first step even when you don’t see the whole staircase. Keep trusting the journey today! 🙏✨',

        likes: 24,

      },
      {

        content: 'Working on some amazing custom branding designs and layouts today. Grateful for creativity and inspiration! 💻🎨',
        media: null,
        likes: 15,
        liked: true,
        comments: []
      }
    ];

    let stories = [
      { id: 1, author: 'Create Story', isCreate: true, bg: '' },
      { id: 2, author: 'Bishop David', bg: 'https://images.unsplash.com/photo-1544717305-2782549b5136?w=300' },
      { id: 3, author: 'Choir Fellowship', bg: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300' },
      { id: 4, author: 'Youth Outreach', bg: 'https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=300' }
    ];

    let friends = [
      { name: 'Sister Grace', role: 'Prayer Group Lead', online: true },
      { name: 'Deacon John', role: 'Media Department', online: false },
      { name: 'Brother Emmanuel', role: 'Youth Ministry', online: true }
    ];

    let groups = [
      { name: 'Daily Scripture & Devotion', members: '1.2k members', joined: true },
      { name: 'Believers Worship Team', members: '340 members', joined: false },
      { name: 'Community Entrepreneurs', members: '850 members', joined: true }
    ];

    /* =========================================================
       HEADER MENU TOGGLE LOGIC
    ========================================================= */
    function toggleHeaderMenu(event) {
      event.stopPropagation();
      const dropdown = document.getElementById('headerMenuDropdown');
      if (dropdown) {
        dropdown.classList.toggle('hidden');
      }
    }

    window.addEventListener('click', function(event) {
      const dropdown = document.getElementById('headerMenuDropdown');
      const toggleBtn = document.getElementById('menuToggleBtn');
      if (dropdown && !dropdown.classList.contains('hidden')) {
        if (!dropdown.contains(event.target) && !toggleBtn.contains(event.target)) {
          dropdown.classList.add('hidden');
        }
      }
    });

    function logout() {
      localStorage.removeItem('bp_user');
      currentUser = null;
      document.getElementById('headerMenuDropdown').classList.add('hidden');
      renderApp();
    }

    /* =========================================================
       RENDER ROUTER
    ========================================================= */
    function renderApp() {
      const main = document.getElementById('mainContent');
      const navWrap = document.getElementById('navWrap');

      if (!currentUser) {
        navWrap.classList.add('hidden');
        main.innerHTML = renderAuthView();
        return;
      }

      navWrap.classList.remove('hidden');
      
      // Update active nav buttons
      document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('nav' + currentTab.charAt(0).toUpperCase() + currentTab.slice(1));
      if (activeBtn) activeBtn.classList.add('active');

      if (currentTab === 'feed') {
        main.innerHTML = renderFeedView();
      } else if (currentTab === 'friends') {
        main.innerHTML = renderFriendsView();
      } else if (currentTab === 'groups') {
        main.innerHTML = renderGroupsView();
      } else if (currentTab === 'profile') {
        main.innerHTML = renderProfileView();
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      renderApp();
      window.scrollTo(0,0);
    }

    /* =========================================================
       AUTH VIEW
    ========================================================= */
    function renderAuthView() {
      return `
        <div class="auth-page">
          <div class="auth">
            <div class="auth-brand">
              <div class="auth-logo"><i class="fa-solid fa-dove"></i></div>
              <div class="brand">Believers<span>+</span></div>
            </div>
            <div class="auth-card">
              <div class="form-group">
                <label>Your Full Name</label>
                <input type="text" id="authName" placeholder="Enter your name (e.g. Oyantee Weah)">
              </div>
              <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="you@example.com">
              </div>
              <button class="btn btn-gold" onclick="handleLogin()">Enter Community</button>
              <div id="authError" class="msg-error hidden">Please fill in all fields.</div>
            </div>
          </div>
        </div>
      `;
    }

    function handleLogin() {
      const name = document.getElementById('authName').value.trim();
      const email = document.getElementById('authEmail').value.trim();
      if (!name || !email) {
        document.getElementById('authError').classList.remove('hidden');
        return;
      }
      currentUser = { name, email, avatar: '' };
      localStorage.setItem('bp_user', JSON.stringify(currentUser));
      currentTab = 'feed';
      renderApp();
    }

    /* =========================================================
       FEED VIEW
    ========================================================= */
    function renderFeedView() {
      return `
        <!-- Stories / Community Updates -->
        <div class="stories-container">
          <div class="stories-wrapper">
            ${stories.map(s => {
              if (s.isCreate) {
                return `
                  <div class="story-card create-story" onclick="triggerStoryUpload()">
                    <div class="top-img" style="background-image: url('${currentUser.avatar || ''}')">
                      <div class="plus-btn">+</div>
                    </div>
                    <div class="bottom-text">Create Story</div>
                  </div>
                `;
              }
              return `
                <div class="story-card" style="background-image: url('${s.bg}'); background-size: cover; background-position: center;">
                  <div class="story-overlay"></div>
                  <div class="story-author">${s.author}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Composer Box -->
        <div class="composer-card">
          <div class="avatar" style="${currentUser.avatar ? 'background-image: url('+currentUser.avatar+')' : ''}">
            ${!currentUser.avatar ? currentUser.name.charAt(0).toUpperCase() : ''}
          </div>
          <div class="mind-button" onclick="openExpandedComposer()">What is on your heart today, ${currentUser.name.split(' ')[0]}?</div>
          <label class="photo-upload-btn" title="Attach Media">
            <i class="fa-solid fa-image"></i>
            <input type="file" accept="image/*,video/*" class="hidden" onchange="handleComposerMedia(event)">
          </label>
        </div>

        <div id="expandedComposerContainer"></div>

        <!-- Feed Posts List -->
        <div id="postsList">
          ${posts.map(post => renderPostCard(post)).join('')}
        </div>
      `;
    }

    function openExpandedComposer() {
      const container = document.getElementById('expandedComposerContainer');
      container.innerHTML = `
        <div id="postComposerArea">
          <textarea class="composer-textarea" id="composerText" placeholder="Share your thoughts, scriptures, or updates..."></textarea>
          <div id="composerPreviewContainer"></div>
          <div class="composer-actions">
            <label class="photo-upload-btn">
              <i class="fa-solid fa-photo-film"></i> <span>Add Photo/Video</span>
              <input type="file" accept="image/*,video/*" class="hidden" onchange="handleComposerMedia(event)">
            </label>
            <button class="btn btn-gold btn-sm" onclick="submitPost()">Post Update</button>
          </div>
        </div>
      `;
      document.getElementById('composerText').focus();
    }

    function handleComposerMedia(event) {
      const file = event.target.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      const type = file.type.startsWith('video') ? 'video' : 'image';
      composerMedia = { type, url };

      // If expanded composer is open, render preview
      const previewContainer = document.getElementById('composerPreviewContainer');
      if (previewContainer) {
        previewContainer.innerHTML = `
          <div class="composer-preview-box">
            <button class="remove-media-btn" onclick="removeComposerMedia()"><i class="fa-solid fa-xmark"></i></button>
            ${type === 'video' ? `<video src="${url}" controls></video>` : `<img src="${url}" alt="Preview">`}
          </div>
        `;
      } else {
        // Automatically open expanded composer if triggered from small input
        openExpandedComposer();
        document.getElementById('composerPreviewContainer').innerHTML = `
          <div class="composer-preview-box">
            <button class="remove-media-btn" onclick="removeComposerMedia()"><i class="fa-solid fa-xmark"></i></button>
            ${type === 'video' ? `<video src="${url}" controls></video>` : `<img src="${url}" alt="Preview">`}
          </div>
        `;
      }
    }

    function removeComposerMedia() {
      composerMedia = null;
      const previewContainer = document.getElementById('composerPreviewContainer');
      if (previewContainer) previewContainer.innerHTML = '';
    }

    function submitPost() {
      const text = document.getElementById('composerText').value.trim();
      if (!text && !composerMedia) return;

      const newPost = {
        id: Date.now(),
        author: currentUser.name,
        avatar: currentUser.avatar,
        time: 'Just now',
        content: text,
        media: composerMedia ? { ...composerMedia } : null,
        likes: 0,
        liked: false,
        comments: []
      };

      posts.unshift(newPost);
      localStorage.setItem('bp_posts', JSON.stringify(posts));
      composerMedia = null;
      renderApp();
    }

    function triggerStoryUpload() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = e => {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          stories.push({ id: Date.now(), author: currentUser.name, bg: url });
          renderApp();
        }
      };
      input.click();
    }

    function renderPostCard(post) {
      return `
        <div class="card" id="post-${post.id}">
          <div class="posthead">
            <div class="posthead-left">
              <div class="avatar" style="${post.avatar ? 'background-image: url('+post.avatar+')' : ''}">
                ${!post.avatar ? post.author.charAt(0).toUpperCase() : ''}
              </div>
              <div>
                <div class="post-author-name">${post.author}</div>
                <div class="post-meta-line"><i class="fa-solid fa-clock"></i> ${post.time}</div>
              </div>
            </div>
            <button style="color: var(--bp-muted);"><i class="fa-solid fa-ellipsis"></i></button>
          </div>

          <div class="post-content">${post.content}</div>

          ${post.media ? `
            <div class="post-media-attachment">
              ${post.media.type === 'video' ? `<video src="${post.media.url}" controls></video>` : `<img src="${post.media.url}" alt="Post attachment">`}
            </div>
          ` : ''}

          <div class="actions">
            <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
              <i class="${post.liked ? 'fa-solid' : 'fa-regular'} fa-heart"></i> <span>${post.likes}</span>
            </button>
            <button class="action-btn" onclick="toggleComments(${post.id})">
              <i class="fa-regular fa-comment"></i> <span>${post.comments.length}</span>
            </button>
            <button class="action-btn" onclick="alert('Post link copied to clipboard!')">
              <i class="fa-solid fa-share"></i> <span>Share</span>
            </button>
          </div>

          <div class="comments-section" id="comments-box-${post.id}">
            <div class="comments-list">
              ${post.comments.map(c => `
                <div class="comment-item">
                  <div class="avatar" style="width:28px; height:28px; font-size:12px;">${c.author.charAt(0)}</div>
                  <div style="flex:1;">
                    <div class="comment-author">${c.author}</div>
                    <div class="comment-text">${c.text}</div>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="comment-input-wrap">
              <input type="text" id="comment-input-${post.id}" placeholder="Write a comment..." onkeydown="if(event.key==='Enter') submitComment(${post.id})">
              <button class="btn btn-gold btn-sm" onclick="submitComment(${post.id})"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
          </div>
        </div>
      `;
    }

    function toggleLike(postId) {
      const post = posts.find(p => p.id === postId);
      if (post) {
        if (post.liked) {
          post.liked = false;
          post.likes--;
        } else {
          post.liked = true;
          post.likes++;
        }
        localStorage.setItem('bp_posts', JSON.stringify(posts));
        renderApp();
      }
    }

    function toggleComments(postId) {
      // Focus comment input
      const input = document.getElementById(`comment-input-${postId}`);
      if (input) input.focus();
    }

    function submitComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const text = input ? input.value.trim() : '';
      if (!text) return;

      const post = posts.find(p => p.id === postId);
      if (post) {
        post.comments.push({ author: currentUser.name, text });
        localStorage.setItem('bp_posts', JSON.stringify(posts));
        renderApp();
      }
    }

    /* =========================================================
       FRIENDS VIEW
    ========================================================= */
    function renderFriendsView() {
      return `
        <div class="card">
          <h2 style="font-size: 18px; font-weight: 800; color: var(--bp-primary); margin-bottom: 4px;">Fellowship Members</h2>
          <p style="font-size: 13px; color: var(--bp-muted);">Connect and pray with other members of your community.</p>
          <div class="friends-list">
            ${friends.map(f => `
              <div class="friend-card">
                <div class="friend-info">
                  <div class="avatar">${f.name.charAt(0)}</div>
                  <div>
                    <div style="font-weight: 800; font-size: 14px; color: var(--bp-primary);">${f.name}</div>
                    <div style="font-size: 11px; color: var(--bp-muted);">${f.role}</div>
                  </div>
                </div>
                <button class="btn btn-gold btn-sm" onclick="alert('Connection request sent to ${f.name}!')">Connect</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    /* =========================================================
       GROUPS VIEW
    ========================================================= */
    function renderGroupsView() {
      return `
        <div class="card">
          <h2 style="font-size: 18px; font-weight: 800; color: var(--bp-primary); margin-bottom: 4px;">Community Groups</h2>
          <p style="font-size: 13px; color: var(--bp-muted);">Join focused circles for prayer, study, and collaboration.</p>
          <div class="groups-list">
            ${groups.map(g => `
              <div class="group-card">
                <div class="group-info">
                  <div class="avatar" style="background:var(--bp-accent); color:var(--bp-gold);"><i class="fa-solid fa-users"></i></div>
                  <div>
                    <div style="font-weight: 800; font-size: 14px; color: var(--bp-primary);">${g.name}</div>
                    <div style="font-size: 11px; color: var(--bp-muted);">${g.members}</div>
                  </div>
                </div>
                <button class="btn ${g.joined ? 'btn-outline' : 'btn-gold'} btn-sm" onclick="toggleGroupJoin('${g.name}')">
                  ${g.joined ? 'Joined' : 'Join'}
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function toggleGroupJoin(groupName) {
      const g = groups.find(item => item.name === groupName);
      if (g) {
        g.joined = !g.joined;
        renderApp();
      }
    }

    /* =========================================================
       PROFILE VIEW
    ========================================================= */
    function renderProfileView() {
      return `
        <div class="profile-card">
          <div class="profile-cover-area"></div>
          <div class="profile-header-content">
            <div class="profile-avatar-wrapper">
              <div class="profile-avatar-large" style="${currentUser.avatar ? 'background-image: url('+currentUser.avatar+')' : ''}">
                ${!currentUser.avatar ? currentUser.name.charAt(0).toUpperCase() : ''}
              </div>
            </div>
            <h1 style="font-size: 20px; font-weight: 800; color: var(--bp-primary);">${currentUser.name}</h1>
            <p style="font-size: 13px; color: var(--bp-muted); margin-top: 2px;">Active Believers+ Member</p>
          </div>
        </div>

        <div class="about-me-card">
          <div class="about-me-header">
            <div class="about-me-title"><i class="fa-solid fa-id-card"></i> Account Information</div>
          </div>
          <div class="profile-field-item">
            <div class="profile-field-icon"><i class="fa-solid fa-user"></i></div>
            <div class="profile-field-content">
              <label>Full Name</label>
              <div>${currentUser.name}</div>
            </div>
          </div>
          <div class="profile-field-item">
            <div class="profile-field-icon"><i class="fa-solid fa-envelope"></i></div>
            <div class="profile-field-content">
              <label>Email Address</label>
              <div>${currentUser.email}</div>
            </div>
          </div>
        </div>
      `;
    }

    // Initialize application on load
    renderApp();
  </script>
</body>
</html>
