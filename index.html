<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1b2a">
<meta name="description" content="Believer+ — Empowering Faith, Fellowship & Community">
<title>Believer+</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =========================================================
   BELIEVER+ DESIGN SYSTEM & THEME
========================================================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

:root {
  --bp-primary: #0d1b2a;       /* Deep Sapphire */
  --bp-accent: #1b263b;        /* Midnight Blue */
  --bp-gold: #e0a96d;          /* Radiant Gold */
  --bp-gold-hover: #c89355;
  --bp-bg: #f4f6f9;            /* Soft Pearl White */
  --bp-card-bg: #ffffff;
  --bp-text: #1b1e23;
  --bp-muted: #6c757d;
  --bp-icon-bg: #e9ecef;
  --bp-border: #e2e8f0;
  --bp-radius: 14px;
  --bp-shadow: 0 4px 12px rgba(13, 27, 42, 0.05);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bp-bg);
  color: var(--bp-text);
  line-height: 1.5;
  padding-bottom: 70px; /* Buffer for mobile bottom nav */
}

button, input, textarea {
  font: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

img {
  max-width: 100%;
  display: block;
}

.hidden {
  display: none !important;
}

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

/* =========================================================
   AUTHENTICATION VIEW (Believer+ Custom)
========================================================= */
.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
  color: white;
}

.auth {
  width: 100%;
  max-width: 410px;
}

.auth-brand {
  text-align: center;
  margin-bottom: 24px;
}

.auth-logo {
  font-size: 52px;
  color: var(--bp-gold);
  margin-bottom: 4px;
}

.brand {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: white;
}

.brand span {
  color: var(--bp-gold);
}

.auth-card {
  background: white;
  border-radius: 18px;
  padding: 24px;
  color: var(--bp-text);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--bp-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
}

.form-group input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--bp-border);
  border-radius: 10px;
  background: #f8fafc;
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus {
  border-color: var(--bp-gold);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: 10px;
  background: var(--bp-primary);
  color: white;
  font-weight: 700;
  width: 100%;
  font-size: 15px;
  transition: opacity 0.2s;
}

.btn:active {
  opacity: 0.9;
}

.btn-gold {
  background: var(--bp-gold);
  color: var(--bp-primary);
}

.btn-gold:hover {
  background: var(--bp-gold-hover);
}

.divider {
  height: 1px;
  background: var(--bp-border);
  margin: 18px 0;
}

.msg-error {
  color: #e63946;
  margin-top: 10px;
  font-size: 13px;
  text-align: center;
  font-weight: 600;
}

/* =========================================================
   HEADER & NAVIGATION
========================================================= */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.header-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-icon {
  font-size: 22px;
  color: var(--bp-gold);
}

.logo {
  font-size: 22px;
  font-weight: 900;
  color: var(--bp-primary);
  letter-spacing: -0.5px;
}

.logo span {
  color: var(--bp-gold);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-circle-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bp-icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--bp-primary);
  transition: background 0.2s;
}

.header-circle-btn:active {
  background: var(--bp-border);
}

.logout-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(230, 57, 70, 0.1);
  color: #e63946;
}

/* NAVIGATION BAR */
.nav-wrap {
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
}

.nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  max-width: 640px;
  margin: 0 auto;
}

.nav button {
  flex: 1;
  padding: 12px 0;
  font-size: 18px;
  color: var(--bp-muted);
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: color 0.2s;
}

.nav button.active {
  color: var(--bp-gold);
  border-bottom: 3px solid var(--bp-gold);
}

.badge {
  position: absolute;
  top: 6px;
  right: 22%;
  background: #e63946;
  color: white;
  font-size: 10px;
  font-weight: bold;
  padding: 1px 5px;
  border-radius: 8px;
}

/* =========================================================
   COMPOSER / CREATE POST AREA
========================================================= */
.composer-card {
  background: var(--bp-card-bg);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
  margin-bottom: 10px;
  border-radius: var(--bp-radius);
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid var(--bp-gold);
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.mind-button {
  flex: 1;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  border-radius: 25px;
  padding: 10px 16px;
  color: var(--bp-muted);
  font-size: 14px;
  text-align: left;
}

.photo-upload-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--bp-gold);
  font-size: 18px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  background: #fff8f0;
}

.photo-upload-btn span {
  font-size: 12px;
  color: var(--bp-primary);
  font-weight: 700;
}

#postComposerArea {
  background: white;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.composer-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 15px;
  resize: none;
  min-height: 85px;
}

.composer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--bp-border);
  padding-top: 10px;
}

.post-image-preview {
  position: relative;
  margin: 8px 0;
}

.post-image-preview img {
  max-height: 220px;
  border-radius: 10px;
  width: 100%;
  object-fit: cover;
}

.remove-post-image {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(13, 27, 42, 0.8);
  color: white;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-weight: bold;
}

/* =========================================================
   COMMUNITY UPDATES / STORIES
========================================================= */
.stories-container {
  background: transparent;
  margin-bottom: 12px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  padding: 2px 0;
}

.stories-container::-webkit-scrollbar {
  display: none;
}

.stories-wrapper {
  display: inline-flex;
  gap: 10px;
}

.story-card {
  width: 110px;
  height: 175px;
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  background: var(--bp-primary);
  flex-shrink: 0;
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
}

.story-card img.bg-story {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}

.story-card .story-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(13, 27, 42, 0.9) 0%, transparent 60%);
}

.story-card .story-author {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  color: white;
  font-size: 11px;
  font-weight: 700;
  white-space: normal;
  line-height: 1.2;
}

.story-card .story-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--bp-gold);
  color: var(--bp-primary);
  font-size: 10px;
  font-weight: 900;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.story-card.create-story {
  background: white;
  display: flex;
  flex-direction: column;
}

.story-card.create-story .top-img {
  height: 115px;
  width: 100%;
  position: relative;
  background: #f1f5f9;
}

.story-card.create-story .top-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.story-card.create-story .plus-btn {
  position: absolute;
  bottom: -13px;
  left: 50%;
  transform: translateX(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bp-gold);
  color: var(--bp-primary);
  border: 2px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.story-card.create-story .bottom-text {
  height: 60px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-size: 11px;
  font-weight: 800;
  color: var(--bp-primary);
  text-align: center;
}

/* =========================================================
   FEED POST CARDS
========================================================= */
.card {
  background: var(--bp-card-bg);
  margin-bottom: 12px;
  padding: 14px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.posthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.posthead-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-author-name {
  font-weight: 800;
  font-size: 14px;
  color: var(--bp-primary);
}

.post-meta-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--bp-muted);
}

.post-content {
  font-size: 14px;
  margin-bottom: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.post-photo {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 10px;
}

.actions {
  display: flex;
  align-items: center;
  justify-content: space-around;
  border-top: 1px solid var(--bp-border);
  padding-top: 8px;
  margin-top: 4px;
}

.action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 0;
  color: var(--bp-muted);
  font-size: 13px;
  font-weight: 700;
  border-radius: 6px;
}

.action-btn.liked {
  color: var(--bp-gold);
}

/* =========================================================
   BOTTOM MOBILE NAVIGATION
========================================================= */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 54px;
  background: var(--bp-primary);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 2000;
}

.bottom-nav button {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.6);
  font-size: 18px;
}

.bottom-nav button.active {
  color: var(--bp-gold);
}

@media (min-width: 641px) {
  body { padding-bottom: 0; }
  .bottom-nav { display: none; }
}
</style>
</head>

<body>

<!-- =======================================================
     AUTHENTICATION PAGE (BELIEVER+)
======================================================= -->
<div id="auth" class="auth-page">
  <div class="auth">
    <div class="auth-brand">
      <div class="auth-logo"><i class="fa-solid fa-cross"></i></div>
      <div class="brand">Believer<span>+</span></div>
      <div style="color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 2px;">One Faith • One Community</div>
    </div>

    <div class="auth-card">
      <!-- LOGIN BOX -->
      <div id="loginBox">
        <h2 style="margin-bottom: 14px; font-size: 18px; color: var(--bp-primary);">Welcome Back</h2>
        <div class="form-group">
          <label>Email Address</label>
          <input id="loginEmail" type="email" placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="loginPass" type="password" placeholder="••••••••">
        </div>
        <button id="loginBtn" class="btn btn-gold" type="button">Log In to Believer+</button>
        <p id="loginMsg" class="msg-error"></p>
        <div class="divider"></div>
        <button id="showSignupBtn" class="btn" type="button">Create Believer+ Account</button>
      </div>

      <!-- SIGNUP BOX -->
      <div id="signupBox" class="hidden">
        <h2 style="margin-bottom: 14px; font-size: 18px; color: var(--bp-primary);">Join Believer+</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input id="name" type="text" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input id="email" type="email" placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="pass" type="password" placeholder="At least 6 characters">
        </div>
        <button id="signupBtn" class="btn btn-gold" type="button">Register</button>
        <p id="signupMsg" class="msg-error"></p>
        <div class="divider"></div>
        <button id="showLoginBtn" class="btn" type="button">Back to Login</button>
      </div>
    </div>
  </div>
</div>

<!-- =======================================================
     MAIN APPLICATION (BELIEVER+)
======================================================= -->
<div id="app" class="hidden">

  <!-- TOP HEADER -->
  <header>
    <div class="header-inner">
      <div class="logo-area">
        <i class="fa-solid fa-cross logo-icon"></i>
        <span class="logo">Believer<span>+</span></span>
      </div>
      <div class="header-actions">
        <button class="header-circle-btn" onclick="toggleComposer()"><i class="fa-solid fa-plus"></i></button>
        <button class="header-circle-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button id="logoutBtn" class="logout-btn" type="button">Log out</button>
      </div>
    </div>

    <!-- MAIN NAVIGATION TABS -->
    <div class="nav-wrap">
      <nav class="nav">
        <button class="active" data-tab="home" onclick="switchTab('home')">
          <i class="fa-solid fa-house-chimney"></i>
        </button>
        <button data-tab="community" onclick="switchTab('community')">
          <i class="fa-solid fa-people-group"></i>
        </button>
        <button data-tab="messages" onclick="switchTab('messages')">
          <i class="fa-solid fa-hand-holding-heart"></i>
        </button>
        <button data-tab="watch" onclick="switchTab('watch')">
          <i class="fa-solid fa-circle-play"></i>
          <span class="badge">4</span>
        </button>
        <button data-tab="notifications" onclick="switchTab('notifications')">
          <i class="fa-solid fa-bell"></i>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">

    <!-- COMPOSER TRIGGER -->
    <div class="composer-card">
      <div id="headerAvatar" class="avatar">B</div>
      <button class="mind-button" onclick="toggleComposer()">Share a word or encouragement...</button>
      <label for="postImageInput" class="photo-upload-btn">
        <i class="fa-solid fa-image"></i>
        <span>Media</span>
      </label>
    </div>

    <!-- POST COMPOSER FORM -->
    <div id="postComposerArea" class="hidden">
      <textarea id="postText" class="composer-textarea" placeholder="What is on your heart today?"></textarea>
      <input type="file" id="postImageInput" accept="image/*" class="hidden">
      
      <div id="postImagePreview" class="post-image-preview hidden">
        <img id="previewImg" src="" alt="Preview">
        <button type="button" class="remove-post-image" id="removeImageBtn">&times;</button>
      </div>

      <div class="composer-actions">
        <span style="font-size: 11px; color: var(--bp-muted); font-weight: 600;">Visible to Believer+ Community</span>
        <button id="submitPostBtn" class="btn btn-gold" style="width: auto; padding: 6px 18px; font-size: 13px;">Publish</button>
      </div>
    </div>

    <!-- COMMUNITY UPDATES / STORIES -->
    <div class="stories-container">
      <div class="stories-wrapper">
        
        <!-- Create Story -->
        <div class="story-card create-story">
          <div class="top-img">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80" alt="User" onerror="handleImageError(this)">
            <div class="plus-btn"><i class="fa-solid fa-plus"></i></div>
          </div>
          <div class="bottom-text">Share Update</div>
        </div>

        <!-- Member Story 1 -->
        <div class="story-card">
          <div class="story-badge">2</div>
          <img class="bg-story" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=300&q=80" alt="Story" onerror="handleImageError(this)">
          <div class="story-overlay"></div>
          <div class="story-author">Abigail Tor</div>
        </div>

        <!-- Member Story 2 -->
        <div class="story-card">
          <div class="story-badge">1</div>
          <img class="bg-story" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Story" onerror="handleImageError(this)">
          <div class="story-overlay"></div>
          <div class="story-author">Rose Kollie</div>
        </div>

        <!-- Member Story 3 -->
        <div class="story-card">
          <div class="story-badge">3</div>
          <img class="bg-story" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=300&q=80" alt="Story" onerror="handleImageError(this)">
          <div class="story-overlay"></div>
          <div class="story-author">Esther W.</div>
        </div>

      </div>
    </div>

    <!-- MAIN FEED -->
    <div id="feedContainer"></div>

  </main>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <button class="active" onclick="switchTab('home')"><i class="fa-solid fa-house-chimney"></i></button>
    <button onclick="switchTab('community')"><i class="fa-solid fa-people-group"></i></button>
    <button onclick="toggleComposer()"><i class="fa-solid fa-square-plus" style="color: var(--bp-gold); font-size: 22px;"></i></button>
    <button onclick="switchTab('notifications')"><i class="fa-solid fa-bell"></i></button>
    <button onclick="switchTab('profile')"><i class="fa-solid fa-user"></i></button>
  </div>

</div>

<!-- =======================================================
     JAVASCRIPT LOGIC
======================================================= -->
<script>
  let currentUser = null;
  let attachedImageBase64 = null;

  // Reliable SVG Fallback Data URI for Broken Media
  const svgPlaceholder = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300' viewBox='0 0 400 300'><rect width='100%' height='100%' fill='%231b263b'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='16' fill='%23e0a96d'>Believer+ Media Unavailable</text></svg>";

  function handleImageError(img) {
    img.onerror = null;
    img.src = svgPlaceholder;
  }

  // Sample Feed Posts
  const posts = [
    {
      id: 1,
      author: "Festous F. Johnson",
      avatarText: "F",
      time: "2 hours ago",
      status: "blessed at Grace Community",
      content: "Blessed Sunday to everyone! Excited to share our community graphic updates with the fellowship today.",
      image: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=600&q=80",
      likes: 12,
      isLiked: false
    }
  ];

  document.addEventListener('DOMContentLoaded', () => {
    
    // Auth View Switches
    document.getElementById('showSignupBtn').addEventListener('click', () => {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('signupBox').classList.remove('hidden');
      clearMsgs();
    });

    document.getElementById('showLoginBtn').addEventListener('click', () => {
      document.getElementById('signupBox').classList.add('hidden');
      document.getElementById('loginBox').classList.remove('hidden');
      clearMsgs();
    });

    // Login Action
    document.getElementById('loginBtn').addEventListener('click', () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const msg = document.getElementById('loginMsg');

      if (!email || !pass) {
        msg.textContent = "Please provide email and password.";
        return;
      }

      currentUser = email.split('@')[0];
      loginUser(currentUser);
    });

    // Registration Action
    document.getElementById('signupBtn').addEventListener('click', () => {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value.trim();
      const msg = document.getElementById('signupMsg');

      if (!name || !email || !pass) {
        msg.textContent = "Please complete all fields.";
        return;
      }

      currentUser = name;
      loginUser(currentUser);
    });

    // Logout Action
    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.getElementById('app').classList.add('hidden');
      document.getElementById('auth').classList.remove('hidden');
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPass').value = '';
      clearMsgs();
    });

    // Media Upload Handler
    const postImageInput = document.getElementById('postImageInput');
    postImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          attachedImageBase64 = evt.target.result;
          document.getElementById('previewImg').src = attachedImageBase64;
          document.getElementById('postImagePreview').classList.remove('hidden');
          document.getElementById('postComposerArea').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('removeImageBtn').addEventListener('click', () => {
      attachedImageBase64 = null;
      document.getElementById('postImageInput').value = '';
      document.getElementById('postImagePreview').classList.add('hidden');
    });

    // Submit Post Action
    document.getElementById('submitPostBtn').addEventListener('click', () => {
      const text = document.getElementById('postText').value.trim();
      if (!text && !attachedImageBase64) return;

      const newPost = {
        id: Date.now(),
        author: currentUser || "Fellow Believer",
        avatarText: (currentUser || "B").charAt(0).toUpperCase(),
        time: "Just now",
        status: "sharing with community",
        content: text,
        image: attachedImageBase64,
        likes: 0,
        isLiked: false
      };

      posts.unshift(newPost);
      renderFeed();

      // Reset composer
      document.getElementById('postText').value = '';
      attachedImageBase64 = null;
      document.getElementById('postImageInput').value = '';
      document.getElementById('postImagePreview').classList.add('hidden');
      document.getElementById('postComposerArea').classList.add('hidden');
    });

  });

  function loginUser(userName) {
    const initial = userName.charAt(0).toUpperCase();
    document.getElementById('headerAvatar').textContent = initial;
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    renderFeed();
  }

  function clearMsgs() {
    document.getElementById('loginMsg').textContent = '';
    document.getElementById('signupMsg').textContent = '';
  }

  function toggleComposer() {
    const area = document.getElementById('postComposerArea');
    area.classList.toggle('hidden');
  }

  function switchTab(tabName) {
    const navButtons = document.querySelectorAll('.nav button');
    navButtons.forEach(btn => {
      if (btn.getAttribute('data-tab') === tabName) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  function toggleLike(postId) {
    const post = posts.find(p => p.id === postId);
    if (post) {
      post.isLiked = !post.isLiked;
      post.likes += post.isLiked ? 1 : -1;
      renderFeed();
    }
  }

  function renderFeed() {
    const feedContainer = document.getElementById('feedContainer');
    feedContainer.innerHTML = '';

    posts.forEach(post => {
      const card = document.createElement('div');
      card.className = 'card';
      
      card.innerHTML = `
        <div class="posthead">
          <div class="posthead-left">
            <div class="avatar">${post.avatarText}</div>
            <div>
              <div class="post-author-name">${post.author}</div>
              <div class="post-meta-line">
                <span>${post.time}</span> • <span>${post.status}</span>
              </div>
            </div>
          </div>
          <button style="color:var(--bp-muted);"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
        ${post.content ? `<div class="post-content">${post.content}</div>` : ''}
        ${post.image ? `<img class="post-photo" src="${post.image}" alt="Community Post" onerror="handleImageError(this)">` : ''}
        <div class="actions">
          <button class="action-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike(${post.id})">
            <i class="${post.isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i> 
            ${post.likes > 0 ? post.likes : ''} Encourage
          </button>
          <button class="action-btn"><i class="fa-regular fa-comment-dots"></i> Reply</button>
          <button class="action-btn"><i class="fa-solid fa-arrow-share-group"></i> Share</button>
        </div>
      `;

      feedContainer.appendChild(card);
    });
  }
</script>

</body>
</html>
