<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1b2a">
<title>Believers+</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =========================================================
   ORIGINAL BELIEVERS+ DESIGN SYSTEM & THEME
========================================================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

:root {
  --bp-primary: #0d1b2a;       /* Deep Sapphire */
  --bp-accent: #1b263b;        /* Midnight Blue */
  --bp-gold: #e0a96d;          /* Radiant Gold */
  --bp-gold-hover: #c89355;
  --bp-bg: #f4f6f9;            /* Soft Pearl White */
  --bp-card-bg: #ffffff;
  --bp-text: #1b1e23;
  --bp-muted: #6c757d;
  --bp-icon-bg: #e9ecef;
  --bp-border: #e2e8f0;
  --bp-radius: 14px;
  --bp-shadow: 0 4px 12px rgba(13, 27, 42, 0.05);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bp-bg);
  color: var(--bp-text);
  line-height: 1.5;
  padding-bottom: 70px;
}

button, input, textarea, select {
  font: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

img, video {
  max-width: 100%;
  display: block;
}

.hidden {
  display: none !important;
}

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

/* =========================================================
   AUTHENTICATION VIEW
========================================================= */
.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
  color: white;
}

.auth {
  width: 100%;
  max-width: 410px;
}

.auth-brand {
  text-align: center;
  margin-bottom: 24px;
}

.auth-logo {
  font-size: 52px;
  color: var(--bp-gold);
  margin-bottom: 4px;
}

.brand {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: white;
}

.brand span {
  color: var(--bp-gold);
}

.auth-card {
  background: white;
  border-radius: 18px;
  padding: 24px;
  color: var(--bp-text);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--bp-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--bp-border);
  border-radius: 10px;
  background: #f8fafc;
  outline: none;
  transition: border-color 0.2s;
  color: var(--bp-text);
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--bp-gold);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: 10px;
  background: var(--bp-primary);
  color: white;
  font-weight: 700;
  width: 100%;
  font-size: 15px;
  transition: opacity 0.2s;
}

.btn:active {
  opacity: 0.9;
}

.btn-gold {
  background: var(--bp-gold);
  color: var(--bp-primary);
}

.btn-gold:hover {
  background: var(--bp-gold-hover);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--bp-border);
  color: var(--bp-primary);
}

.divider {
  height: 1px;
  background: var(--bp-border);
  margin: 18px 0;
}

.msg-error {
  color: #e63946;
  margin-top: 10px;
  font-size: 13px;
  text-align: center;
  font-weight: 600;
}

/* =========================================================
   HEADER & NAVIGATION
========================================================= */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.header-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.logo-icon {
  font-size: 22px;
  color: var(--bp-gold);
}

.logo {
  font-size: 22px;
  font-weight: 900;
  color: var(--bp-primary);
  letter-spacing: -0.5px;
}

.logo span {
  color: var(--bp-gold);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}

.header-circle-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bp-icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--bp-primary);
  transition: background 0.2s;
  position: relative;
}

.logout-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(230, 57, 70, 0.1);
  color: #e63946;
}

/* =========================================================
   HEADER MENU DROPDOWN
========================================================= */
.menu-dropdown {
  position: absolute;
  top: 50px;
  right: 0;
  width: 200px;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border: 1px solid var(--bp-border);
  z-index: 1001;
  overflow: hidden;
}

.menu-item {
  width: 100%;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  font-weight: 700;
  color: #e63946;
  background: white;
  text-align: left;
  transition: background 0.2s;
}

.menu-item:hover {
  background: #f8fafc;
}

.nav-wrap {
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
}

.nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  max-width: 640px;
  margin: 0 auto;
}

.nav button {
  flex: 1;
  padding: 12px 0;
  font-size: 18px;
  color: var(--bp-muted);
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: color 0.2s;
}

.nav button.active {
  color: var(--bp-gold);
  border-bottom: 3px solid var(--bp-gold);
}

.badge {
  position: absolute;
  top: 2px;
  right: 6px;
  background: #e63946;
  color: white;
  font-size: 10px;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 10px;
}

/* =========================================================
   SEARCH BAR & NOTIFICATIONS
========================================================= */
.search-modal-box {
  background: white;
  padding: 12px 16px;
  border-bottom: 1px solid var(--bp-border);
}

.search-input-wrapper {
  display: flex;
  align-items: center;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  border-radius: 20px;
  padding: 8px 14px;
  gap: 10px;
}

.search-input-wrapper input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 14px;
}

.search-results-list {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 250px;
  overflow-y: auto;
}

.search-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: white;
  border-radius: 10px;
  border: 1px solid var(--bp-border);
  cursor: pointer;
}

.notif-dropdown {
  position: absolute;
  top: 50px;
  right: 16px;
  width: 320px;
  max-width: 90vw;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border: 1px solid var(--bp-border);
  z-index: 1001;
  overflow: hidden;
}

.notif-header {
  padding: 12px 14px;
  background: #f8fafc;
  border-bottom: 1px solid var(--bp-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 800;
  font-size: 14px;
  color: var(--bp-primary);
}

.notif-header button {
  font-size: 11px;
  color: var(--bp-gold-hover);
  font-weight: 700;
}

.notif-list {
  max-height: 320px;
  overflow-y: auto;
}

.notif-item {
  padding: 12px;
  border-bottom: 1px solid var(--bp-border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  background: white;
}

.notif-item.unread {
  background: #f0f7ff;
}

/* =========================================================
   COMPOSER / WHAT IS ON YOUR HEART TODAY
========================================================= */
.composer-card {
  background: var(--bp-card-bg);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
  margin-bottom: 10px;
  border-radius: var(--bp-radius);
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid var(--bp-gold);
  cursor: pointer;
  background-size: cover;
  background-position: center;
}

.mind-button {
  flex: 1;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  border-radius: 25px;
  padding: 10px 16px;
  color: var(--bp-muted);
  font-size: 14px;
  text-align: left;
}

.photo-upload-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--bp-gold);
  font-size: 18px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  background: #fff8f0;
}

.photo-upload-btn span {
  font-size: 12px;
  color: var(--bp-primary);
  font-weight: 700;
}

#postComposerArea {
  background: white;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.composer-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 15px;
  resize: none;
  min-height: 85px;
}

.composer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--bp-border);
  padding-top: 10px;
}

/* =========================================================
   IN-COMPOSER MEDIA PREVIEW CONTAINER STYLING
========================================================= */
.composer-preview-box {
  position: relative;
  margin: 10px 0;
  background: #f8fafc;
  border-radius: 10px;
  border: 1px solid var(--bp-border);
  overflow: hidden;
  max-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.composer-preview-box img,
.composer-preview-box video {
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  display: block;
}

.remove-media-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(13, 27, 42, 0.75);
  color: white;
  border: none;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  backdrop-filter: blur(4px);
  transition: background 0.2s;
}

.remove-media-btn:hover {
  background: rgba(230, 57, 70, 0.9);
}

/* =========================================================
   COMMUNITY UPDATES / STORIES
========================================================= */
.stories-container {
  background: transparent;
  margin-bottom: 12px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  padding: 2px 0;
}

.stories-container::-webkit-scrollbar {
  display: none;
}

.stories-wrapper {
  display: inline-flex;
  gap: 10px;
}

.story-card {
  width: 110px;
  height: 175px;
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  background: var(--bp-primary);
  flex-shrink: 0;
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
  cursor: pointer;
}

.story-card img.bg-story {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}

.story-card .story-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(13, 27, 42, 0.9) 0%, transparent 60%);
}

.story-card .story-author {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  color: white;
  font-size: 11px;
  font-weight: 700;
  white-space: normal;
  line-height: 1.2;
}

.story-card.create-story {
  background: white;
  display: flex;
  flex-direction: column;
}

.story-card.create-story .top-img {
  height: 115px;
  width: 100%;
  position: relative;
  background: #f1f5f9;
  background-size: cover;
  background-position: center;
}

.story-card.create-story .plus-btn {
  position: absolute;
  bottom: -13px;
  left: 50%;
  transform: translateX(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bp-gold);
  color: var(--bp-primary);
  border: 2px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.story-card.create-story .bottom-text {
  height: 60px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-size: 11px;
  font-weight: 800;
  color: var(--bp-primary);
  text-align: center;
}

/* =========================================================
   FEED POST CARDS & HORIZONTAL ACTIONS (LIKE, COMMENT, SHARE)
========================================================= */
.card {
  background: var(--bp-card-bg);
  margin-bottom: 12px;
  padding: 14px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.posthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.posthead-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.post-author-name {
  font-weight: 800;
  font-size: 14px;
  color: var(--bp-primary);
}

.post-meta-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--bp-muted);
}

.post-content {
  font-size: 14px;
  margin-bottom: 10px;
  white-space: pre-wrap;
}

.post-media-attachment {
  width: 100%;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 10px;
  background: #000;
}

.post-media-attachment img,
.post-media-attachment video {
  width: 100%;
  max-height: 450px;
  object-fit: contain;
  display: block;
}

/* Horizontal Actions Row: ❤️ Like | 💬 Comment | ↗️ Share */
.actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--bp-border);
  padding-top: 8px;
  margin-top: 4px;
  gap: 4px;
}

.action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 4px;
  color: var(--bp-muted);
  font-size: 13px;
  font-weight: 700;
  border-radius: 6px;
  transition: color 0.2s, background 0.2s;
  white-space: nowrap;
}

.action-btn:hover {
  background: #f8fafc;
}

.action-btn.liked {
  color: #e63946;
}

/* Comments Section Styling */
.comments-section {
  margin-top: 10px;
  border-top: 1px dashed var(--bp-border);
  padding-top: 10px;
}

.comments-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 10px;
  max-height: 200px;
  overflow-y: auto;
}

.comment-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 13px;
  background: #f8fafc;
  padding: 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--bp-border);
}

.comment-author {
  font-weight: 800;
  color: var(--bp-primary);
  font-size: 12px;
}

.comment-text {
  color: var(--bp-text);
  margin-top: 2px;
  word-break: break-word;
}

.comment-input-wrap {
  display: flex;
  gap: 8px;
  align-items: center;
}

.comment-input-wrap input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--bp-border);
  border-radius: 20px;
  outline: none;
  font-size: 13px;
  background: #f8fafc;
}

.comment-input-wrap input:focus {
  border-color: var(--bp-gold);
}

/* =========================================================
   FRIENDS, GROUPS & VIDEO MODULES
========================================================= */
.friends-list, .groups-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.friend-card, .group-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 12px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.friend-info, .group-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 8px;
  font-weight: 700;
}

.video-card {
  background: white;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: var(--bp-shadow);
}

.video-container {
  position: relative;
  background: black;
  width: 100%;
  aspect-ratio: 16/9;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.video-info {
  padding: 12px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(13, 27, 42, 0.6);
  z-index: 3000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(3px);
}

.modal-sheet {
  background: white;
  width: 100%;
  max-width: 640px;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  padding: 20px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
}

/* =========================================================
   RESTORED PROFILE, COVER PHOTO & ABOUT ME STYLES
========================================================= */
.profile-card {
  background: white;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
  overflow: hidden;
  margin-bottom: 12px;
  position: relative;
}

.profile-cover-area {
  height: 140px;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  background-size: cover;
  background-position: center;
  position: relative;
}

.cover-upload-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  background: rgba(13, 27, 42, 0.75);
  color: white;
  border-radius: 20px;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(4px);
  border: 1px solid rgba(255,255,255,0.2);
}

.profile-header-content {
  padding: 0 16px 16px 16px;
  text-align: center;
  position: relative;
  margin-top: -40px;
}

.profile-avatar-wrapper {
  position: relative;
  width: 84px;
  height: 84px;
  margin: 0 auto 8px auto;
}

.profile-avatar-large {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 32px;
  border: 3px solid white;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

.avatar-upload-badge {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--bp-gold);
  color: var(--bp-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  border: 2px solid white;
  cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

.about-me-card {
  background: white;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
  padding: 16px;
  margin-bottom: 12px;
}

.about-me-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--bp-border);
}

        </button>

  <script>
    // Toggle Header Menu
    function toggleHeaderMenu(event) {
      event.stopPropagation();
      const dropdown = document.getElementById('headerMenuDropdown');
      if (dropdown) {
        dropdown.classList.toggle('hidden');
      }
    }

    // Close menu when clicking outside
    window.addEventListener('click', function(event) {
      const dropdown = document.getElementById('headerMenuDropdown');
      const toggleBtn = document.getElementById('menuToggleBtn');
      if (dropdown && !dropdown.classList.contains('hidden')) {
        if (!dropdown.contains(event.target) && !toggleBtn.contains(event.target)) {
          dropdown.classList.add('hidden');
        }
      }
    });

    // Existing logout function placeholder (connects to your project's authentication system)
