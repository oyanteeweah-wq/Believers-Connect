<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Believers+</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .glass-effect { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>

<body class="bg-slate-100 text-slate-800 font-sans antialiased selection:bg-indigo-500 selection:text-white min-h-screen">

  <!-- ========================================== -->
  <!-- 1. AUTHENTICATION SCREEN                   -->
  <!-- ========================================== -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-indigo-800 to-slate-900">
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl overflow-hidden border border-white/20 p-8 space-y-6">
      
      <!-- Logo Header -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-600 text-white shadow-lg mb-2">
          <i class="fa-solid font-bold text-2xl">B+</i>
        </div>
        <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Believers+</h1>
        <p class="text-sm text-slate-500">Connect, Pray, and Grow Together in Faith</p>
      </div>

      <!-- Auth Tabs -->
      <div class="flex border-b border-slate-200 text-center font-semibold text-slate-600">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 focus:outline-none transition">Sign In</button>
        <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-3 border-b-2 border-transparent hover:text-slate-800 focus:outline-none transition">Create Account</button>
      </div>

      <!-- Auth Form -->
      <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        
        <!-- Registration Full Name Field -->
        <div id="fullNameGroup" class="hidden">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3 top-3.5 text-slate-400"></i>
            <input type="text" id="authFullName" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition" placeholder="John Doe" />
          </div>
        </div>

        <!-- Email Field -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3 top-3.5 text-slate-400"></i>
            <input type="email" id="authEmail" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition" placeholder="believer@example.com" />
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1">Password</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-3.5 text-slate-400"></i>
            <input type="password" id="authPassword" required minlength="6" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm outline-none transition" placeholder="••••••••" />
          </div>
        </div>

        <!-- Feedback Message Display -->
        <div id="authError" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-xl border border-red-200"></div>
        <div id="authSuccess" class="hidden text-sm text-emerald-600 bg-emerald-50 p-3 rounded-xl border border-emerald-200"></div>

        <!-- Submit Button -->
        <button type="submit" id="authBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
          <span id="authBtnText">Sign In</span>
          <i id="authSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
        </button>
      </form>

    </div>
  </div>

  <!-- ========================================== -->
  <!-- 2. MAIN APPLICATION SCREEN                 -->
  <!-- ========================================== -->
  <div id="appScreen" class="hidden min-h-screen flex flex-col">
    
    <!-- Top Navigation Bar -->
    <header class="sticky top-0 z-40 glass-effect border-b border-slate-200 shadow-sm">
      <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
        
        <!-- Brand -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 text-white font-black flex items-center justify-center text-lg shadow-md">
            B+
          </div>
          <span class="text-xl font-black text-indigo-900 tracking-tight hidden sm:inline">Believers+</span>
        </div>

        <!-- Global Search Bar -->
        <div class="flex-1 max-w-md relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
          <input type="text" placeholder="Search posts, prayers, believers..." class="w-full pl-9 pr-4 py-2 bg-slate-100 focus:bg-white rounded-full text-sm border border-transparent focus:border-indigo-300 focus:ring-2 focus:ring-indigo-500/20 outline-none transition" />
        </div>

        <!-- Header Controls -->
        <div class="flex items-center gap-2">
          <button class="w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 transition">
            <i class="fa-solid fa-bell"></i>
          </button>
          
          <!-- User Profile Dropdown / Logout -->
          <div class="flex items-center gap-2 pl-2 border-l border-slate-200">
            <img id="navAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80" class="w-9 h-9 rounded-full object-cover border border-indigo-200" alt="Avatar" />
            <button onclick="handleLogout()" title="Logout" class="px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50 rounded-lg transition border border-red-200 flex items-center gap-1">
              <i class="fa-solid fa-right-from-bracket"></i>
              <span class="hidden md:inline">Sign Out</span>
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 grid grid-cols-1 md:grid-cols-4 gap-6">
      
      <!-- Left Sidebar (Navigation & Profile Brief) -->
      <aside class="md:col-span-1 space-y-6">
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm text-center">
          <div class="relative inline-block mb-3">
            <img id="profileAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80" class="w-20 h-20 rounded-full object-cover border-2 border-indigo-500 p-0.5" alt="Profile" />
          </div>
          <h2 id="profileName" class="font-extrabold text-slate-800 text-lg">Believer</h2>
          <p id="profileJoined" class="text-xs text-slate-400 font-medium mt-1">Joined Believers+ ...</p>

          <!-- Edit Profile Trigger -->
          <button onclick="openEditProfileModal()" class="mt-4 w-full py-2 text-xs font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition">
            Edit Profile
          </button>
        </div>

        <!-- Navigation Menu -->
        <nav class="bg-white rounded-2xl p-3 border border-slate-200/80 shadow-sm space-y-1 font-semibold text-sm text-slate-600">
          <a href="#" class="flex items-center gap-3 px-4 py-3 bg-indigo-50 text-indigo-600 rounded-xl">
            <i class="fa-solid fa-house text-indigo-600"></i> Feed
          </a>
          <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 rounded-xl transition">
            <i class="fa-solid fa-hands-praying"></i> Prayer Requests
          </a>
          <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 rounded-xl transition">
            <i class="fa-solid fa-user-group"></i> Fellowship Groups
          </a>
          <a href="#" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 rounded-xl transition">
            <i class="fa-solid fa-book-bible"></i> Bible Studies
          </a>
        </nav>
      </aside>

      <!-- Center Content Feed -->
      <main class="md:col-span-2 space-y-6">
        
        <!-- Post Creator Box -->
        <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-3">
          <div class="flex gap-3">
            <img id="postBoxAvatar" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80" class="w-10 h-10 rounded-full object-cover" alt="Avatar" />
            <textarea id="newPostContent" rows="3" placeholder="Share a testimony, scripture, or prayer request..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition resize-none"></textarea>
          </div>
          <div class="flex items-center justify-between border-t border-slate-100 pt-3">
            <div class="flex items-center gap-2 text-slate-500 text-xs font-semibold">
              <button class="flex items-center gap-1.5 px-3 py-1.5 hover:bg-slate-100 rounded-lg transition"><i class="fa-solid fa-image text-emerald-500"></i> Photo</button>
              <button class="flex items-center gap-1.5 px-3 py-1.5 hover:bg-slate-100 rounded-lg transition"><i class="fa-solid fa-hands-praying text-amber-500"></i> Prayer</button>
            </div>
            <button onclick="handleCreatePost()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition">
              Publish
            </button>
          </div>
        </div>

        <!-- Feed List -->
        <div id="postsFeed" class="space-y-4">
          <!-- Dynamic Posts Injected Here -->
        </div>
      </main>

      <!-- Right Sidebar (Prayers & Recommended Groups) -->
      <aside class="md:col-span-1 space-y-6">
        
        <!-- Prayer Request Widget -->
        <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-extrabold text-slate-800 text-sm flex items-center gap-2">
              <i class="fa-solid fa-hands-praying text-indigo-600"></i> Active Prayers
            </h3>
          </div>
          <div id="prayerRequestsList" class="space-y-3 text-xs">
            <p class="text-slate-400 italic">Loading active prayer requests...</p>
          </div>
        </div>

      </aside>

    </div>
  </div>

  <!-- Profile Edit Modal -->
  <div id="editProfileModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
      <h3 class="text-lg font-extrabold text-slate-900">Edit Profile</h3>
      
      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label>
        <input type="text" id="editFullName" class="w-full p-3 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Avatar URL</label>
        <input type="url" id="editAvatarUrl" class="w-full p-3 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeEditProfileModal()" class="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">Cancel</button>
        <button onclick="handleSaveProfile()" class="px-4 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl transition">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- 3. APPLICATION JAVASCRIPT LOGIC            -->
  <!-- ========================================== -->
  <script>
    // --- SUPABASE CLIENT CONFIGURATION ---
    const SUPABASE_URL = "https://your-supabase-project.supabase.co";
    const SUPABASE_ANON_KEY = "your-anon-key";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Dynamic State Variable
    let currentUser = null;
    let authMode = 'login'; // 'login' or 'register'

    // Document Initialization
    document.addEventListener('DOMContentLoaded', () => {
      initAuth();
    });

    // --- AUTHENTICATION ENGINE ---
    async function initAuth() {
      // 1. Initial Session Retrieval
      const { data: { session }, error } = await supabaseClient.auth.getSession();
      
      if (session && session.user) {
        currentUser = session.user;
        await loadProfileAndInitialize();
      } else {
        showAuthScreen();
      }

      // 2. Auth State Observer Listener
      supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (session && session.user) {
          currentUser = session.user;
          await loadProfileAndInitialize();
        } else {
          currentUser = null;
          showAuthScreen();
        }
      });
    }

    function switchAuthTab(mode) {
      authMode = mode;
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const fullNameGroup = document.getElementById('fullNameGroup');
      const authBtnText = document.getElementById('authBtnText');
      
      hideAuthFeedback();

      if (mode === 'register') {
        tabRegister.className = "flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 focus:outline-none transition font-semibold";
        tabLogin.className = "flex-1 py-3 border-b-2 border-transparent hover:text-slate-800 focus:outline-none transition font-semibold";
        fullNameGroup.classList.remove('hidden');
        authBtnText.textContent = 'Create Account';
      } else {
        tabLogin.className = "flex-1 py-3 border-b-2 border-indigo-600 text-indigo-600 focus:outline-none transition font-semibold";
        tabRegister.className = "flex-1 py-3 border-b-2 border-transparent hover:text-slate-800 focus:outline-none transition font-semibold";
        fullNameGroup.classList.add('hidden');
        authBtnText.textContent = 'Sign In';
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      hideAuthFeedback();

      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const fullName = document.getElementById('authFullName').value.trim();

      setAuthLoading(true);

      try {
        if (authMode === 'register') {
          // Supabase Auth Registration
          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: fullName
              }
            }
          });

          if (error) throw error;

          showAuthSuccess("Registration successful! Please check your email or log in.");
        } else {
          // Supabase Auth Login
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) throw error;
        }
      } catch (err) {
        showAuthError(err.message || "Authentication failed.");
      } finally {
        setAuthLoading(false);
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
    }

    // --- SCREEN STATE MANAGERS ---
    function showAuthScreen() {
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('appScreen').classList.add('hidden');
    }

    function showMainAppScreen() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
    }

    // --- USER PROFILE INTEGRATION ---
    async function loadProfileAndInitialize() {
      if (!currentUser) return;

      try {
        // Fetch or Initialize Profile record in public.profiles
        let { data: profile, error } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .single();

        if (error && error.code === 'PGRST116') {
          // Record missing; initialize missing profile row
          const newProfile = {
            id: currentUser.id,
            full_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
            avatar_url: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80'
          };

          const { data: createdProfile, error: createErr } = await supabaseClient
            .from('profiles')
            .insert([newProfile])
            .select()
            .single();

          if (!createErr) profile = createdProfile;
        }

        // Render UI with Profile details
        if (profile) {
          const name = profile.full_name || currentUser.email;
          const avatar = profile.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80';
          
          document.getElementById('profileName').textContent = name;
          document.getElementById('navAvatar').src = avatar;
          document.getElementById('profileAvatar').src = avatar;
          document.getElementById('postBoxAvatar').src = avatar;

          // Format registration date from database created_at
          if (profile.created_at) {
            const date = new Date(profile.created_at);
            document.getElementById('profileJoined').textContent = `Joined Believers+ ${date.toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}`;
          }
        }

        showMainAppScreen();
        
        // Load Core Application Feeds
        await Promise.all([
          loadPostsFeed(),
          loadPrayerRequests()
        ]);

      } catch (err) {
        console.error("Error loading application resources:", err);
      }
    }

    // --- PROFILE MODAL ACTIONS ---
    function openEditProfileModal() {
      document.getElementById('editFullName').value = document.getElementById('profileName').textContent;
      document.getElementById('editAvatarUrl').value = document.getElementById('profileAvatar').src;
      document.getElementById('editProfileModal').classList.remove('hidden');
    }

    function closeEditProfileModal() {
      document.getElementById('editProfileModal').classList.add('hidden');
    }

    async function handleSaveProfile() {
      const newName = document.getElementById('editFullName').value.trim();
      const newAvatar = document.getElementById('editAvatarUrl').value.trim();

      const { error } = await supabaseClient
        .from('profiles')
        .update({
          full_name: newName,
          avatar_url: newAvatar
        })
        .eq('id', currentUser.id);

      if (!error) {
        closeEditProfileModal();
        await loadProfileAndInitialize();
      } else {
        alert("Error saving profile: " + error.message);
      }
    }

    // --- POSTS ENGINE ---
    async function loadPostsFeed() {
      const container = document.getElementById('postsFeed');
      
      const { data: posts, error } = await supabaseClient
        .from('posts')
        .select(`
          *,
          profiles:user_id (full_name, avatar_url),
          post_likes (user_id)
        `)
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="p-4 bg-red-50 text-red-600 rounded-xl text-sm">Error loading posts: ${error.message}</div>`;
        return;
      }

      if (!posts || posts.length === 0) {
        container.innerHTML = `<div class="p-8 text-center bg-white rounded-2xl border border-slate-200 text-slate-400 text-sm">No posts yet. Be the first to share!</div>`;
        return;
      }

      container.innerHTML = posts.map(post => {
        const isLiked = post.post_likes?.some(like => like.user_id === currentUser.id);
        const likeCount = post.post_likes?.length || 0;
        const authorName = post.profiles?.full_name || 'Believer';
        const authorAvatar = post.profiles?.avatar_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80';

        return `
          <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-sm space-y-4">
            <div class="flex items-center gap-3">
              <img src="${authorAvatar}" class="w-10 h-10 rounded-full object-cover" />
              <div>
                <h4 class="font-bold text-slate-800 text-sm">${authorName}</h4>
                <p class="text-xs text-slate-400">${new Date(post.created_at).toLocaleDateString()}</p>
              </div>
            </div>
            
            <p class="text-slate-700 text-sm leading-relaxed">${escapeHtml(post.content)}</p>

            <div class="flex items-center gap-6 pt-3 border-t border-slate-100 text-xs font-semibold text-slate-500">
              <button onclick="toggleLike('${post.id}', ${isLiked})" class="flex items-center gap-1.5 ${isLiked ? 'text-red-500 font-bold' : 'hover:text-red-500'} transition">
                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                <span>${likeCount} ${likeCount === 1 ? 'Like' : 'Likes'}</span>
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function handleCreatePost() {
      const textarea = document.getElementById('newPostContent');
      const content = textarea.value.trim();

      if (!content) return;

      const { error } = await supabaseClient
        .from('posts')
        .insert([{
          user_id: currentUser.id,
          content: content
        }]);

      if (!error) {
        textarea.value = '';
        await loadPostsFeed();
      } else {
        alert("Could not create post: " + error.message);
      }
    }

    // --- LIKE SYSTEM ---
    async function toggleLike(postId, isCurrentlyLiked) {
      if (isCurrentlyLiked) {
        await supabaseClient
          .from('post_likes')
          .delete()
          .eq('post_id', postId)
          .eq('user_id', currentUser.id);
      } else {
        await supabaseClient
          .from('post_likes')
          .insert([{
            post_id: postId,
            user_id: currentUser.id
          }]);
      }
      await loadPostsFeed();
    }

    // --- PRAYER REQUESTS ENGINE ---
    async function loadPrayerRequests() {
      const container = document.getElementById('prayerRequestsList');

      const { data: prayers, error } = await supabaseClient
        .from('prayer_requests')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(5);

      if (error || !prayers || prayers.length === 0) {
        container.innerHTML = `<p class="text-slate-400 italic">No active prayer requests.</p>`;
        return;
      }

      container.innerHTML = prayers.map(p => `
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-1">
          <p class="font-semibold text-slate-700">${escapeHtml(p.title || 'Prayer Request')}</p>
          <p class="text-slate-500 line-clamp-2">${escapeHtml(p.request)}</p>
        </div>
      `).join('');
    }

    // --- UTILITIES & FEEDBACK HELPERS ---
    function setAuthLoading(loading) {
      const btn = document.getElementById('authBtn');
      const spinner = document.getElementById('authSpinner');
      btn.disabled = loading;
      if (loading) {
        spinner.classList.remove('hidden');
      } else {
        spinner.classList.add('hidden');
      }
    }

    function showAuthError(msg) {
      const errBox = document.getElementById('authError');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }

    function showAuthSuccess(msg) {
      const successBox = document.getElementById('authSuccess');
      successBox.textContent = msg;
      successBox.classList.remove('hidden');
    }

    function hideAuthFeedback() {
      document.getElementById('authError').classList.add('hidden');
      document.getElementById('authSuccess').classList.add('hidden');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
