<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1b2a">
<meta name="description" content="Believers+ — Empowering Faith, Fellowship & Community">
<title>Believers+</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =========================================================
   BELIEVERS+ DESIGN SYSTEM & THEME
========================================================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

:root {
  --bp-primary: #0d1b2a;       /* Deep Sapphire */
  --bp-accent: #1b263b;        /* Midnight Blue */
  --bp-gold: #e0a96d;          /* Radiant Gold */
  --bp-gold-hover: #c89355;
  --bp-bg: #f4f6f9;            /* Soft Pearl White */
  --bp-card-bg: #ffffff;
  --bp-text: #1b1e23;
  --bp-muted: #6c757d;
  --bp-icon-bg: #e9ecef;
  --bp-border: #e2e8f0;
  --bp-radius: 14px;
  --bp-shadow: 0 4px 12px rgba(13, 27, 42, 0.05);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bp-bg);
  color: var(--bp-text);
  line-height: 1.5;
  padding-bottom: 70px;
}

button, input, textarea, select {
  font: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

img, video {
  max-width: 100%;
  display: block;
}

.hidden {
  display: none !important;
}

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

/* =========================================================
   AUTHENTICATION VIEW
========================================================= */
.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
  color: white;
}

.auth {
  width: 100%;
  max-width: 410px;
}

.auth-brand {
  text-align: center;
  margin-bottom: 24px;
}

.auth-logo {
  font-size: 52px;
  color: var(--bp-gold);
  margin-bottom: 4px;
}

.brand {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: white;
}

.brand span {
  color: var(--bp-gold);
}

.auth-card {
  background: white;
  border-radius: 18px;
  padding: 24px;
  color: var(--bp-text);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--bp-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--bp-border);
  border-radius: 10px;
  background: #f8fafc;
  outline: none;
  transition: border-color 0.2s;
  color: var(--bp-text);
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--bp-gold);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: 10px;
  background: var(--bp-primary);
  color: white;
  font-weight: 700;
  width: 100%;
  font-size: 15px;
  transition: opacity 0.2s;
}

.btn:active {
  opacity: 0.9;
}

.btn-gold {
  background: var(--bp-gold);
  color: var(--bp-primary);
}

.btn-gold:hover {
  background: var(--bp-gold-hover);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--bp-border);
  color: var(--bp-primary);
}

.divider {
  height: 1px;
  background: var(--bp-border);
  margin: 18px 0;
}

.msg-error {
  color: #e63946;
  margin-top: 10px;
  font-size: 13px;
  text-align: center;
  font-weight: 600;
}

/* =========================================================
   HEADER & NAVIGATION
========================================================= */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.header-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.logo-icon {
  font-size: 22px;
  color: var(--bp-gold);
}

.logo {
  font-size: 22px;
  font-weight: 900;
  color: var(--bp-primary);
  letter-spacing: -0.5px;
}

.logo span {
  color: var(--bp-gold);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
}

.header-circle-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bp-icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--bp-primary);
  transition: background 0.2s;
  position: relative;
}

.logout-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(230, 57, 70, 0.1);
  color: #e63946;
}

.nav-wrap {
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
}

.nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  max-width: 640px;
  margin: 0 auto;
}

.nav button {
  flex: 1;
  padding: 12px 0;
  font-size: 18px;
  color: var(--bp-muted);
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: color 0.2s;
}

.nav button.active {
  color: var(--bp-gold);
  border-bottom: 3px solid var(--bp-gold);
}

.badge {
  position: absolute;
  top: 2px;
  right: 6px;
  background: #e63946;
  color: white;
  font-size: 10px;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 10px;
}

/* =========================================================
   COMPOSER / CREATE POST AREA
========================================================= */
.composer-card {
  background: var(--bp-card-bg);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
  margin-bottom: 10px;
  border-radius: var(--bp-radius);
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid var(--bp-gold);
  cursor: pointer;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.mind-button {
  flex: 1;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  border-radius: 25px;
  padding: 10px 16px;
  color: var(--bp-muted);
  font-size: 14px;
  text-align: left;
}

.photo-upload-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--bp-gold);
  font-size: 18px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  background: #fff8f0;
}

.photo-upload-btn span {
  font-size: 12px;
  color: var(--bp-primary);
  font-weight: 700;
}

#postComposerArea {
  background: white;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.composer-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 15px;
  resize: none;
  min-height: 85px;
}

.composer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--bp-border);
  padding-top: 10px;
}

/* =========================================================
   COMMUNITY UPDATES / STORIES
========================================================= */
.stories-container {
  background: transparent;
  margin-bottom: 12px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  padding: 2px 0;
}

.stories-container::-webkit-scrollbar {
  display: none;
}

.stories-wrapper {
  display: inline-flex;
  gap: 10px;
}

.story-card {
  width: 110px;
  height: 175px;
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  background: var(--bp-primary);
  flex-shrink: 0;
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
  cursor: pointer;
}

.story-card img.bg-story {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}

.story-card .story-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(13, 27, 42, 0.9) 0%, transparent 60%);
}

.story-card .story-author {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  color: white;
  font-size: 11px;
  font-weight: 700;
  white-space: normal;
  line-height: 1.2;
}

.story-card .story-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--bp-gold);
  color: var(--bp-primary);
  font-size: 10px;
  font-weight: 900;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.story-card.create-story {
  background: white;
  display: flex;
  flex-direction: column;
}

.story-card.create-story .top-img {
  height: 115px;
  width: 100%;
  position: relative;
  background: #f1f5f9;
}

.story-card.create-story .top-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.story-card.create-story .plus-btn {
  position: absolute;
  bottom: -13px;
  left: 50%;
  transform: translateX(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bp-gold);
  color: var(--bp-primary);
  border: 2px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.story-card.create-story .bottom-text {
  height: 60px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-size: 11px;
  font-weight: 800;
  color: var(--bp-primary);
  text-align: center;
}

/* =========================================================
   FEED POST CARDS
========================================================= */
.card {
  background: var(--bp-card-bg);
  margin-bottom: 12px;
  padding: 14px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.posthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.posthead-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.clickable-user {
  cursor: pointer;
}

.clickable-user:hover {
  text-decoration: underline;
}

.post-author-name {
  font-weight: 800;
  font-size: 14px;
  color: var(--bp-primary);
}

.post-meta-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--bp-muted);
}

.post-content {
  font-size: 14px;
  margin-bottom: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.post-photo {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 10px;
}

.actions {
  display: flex;
  align-items: center;
  justify-content: space-around;
  border-top: 1px solid var(--bp-border);
  padding-top: 8px;
  margin-top: 4px;
}

.action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 0;
  color: var(--bp-muted);
  font-size: 13px;
  font-weight: 700;
  border-radius: 6px;
}

.action-btn.liked {
  color: var(--bp-gold);
}

/* =========================================================
   SEARCH BAR & NOTIFICATIONS & CREATED MODULES
========================================================= */
.search-container {
  padding: 10px 16px;
  background: white;
  border-bottom: 1px solid var(--bp-border);
  position: relative;
}

.search-input-box {
  display: flex;
  align-items: center;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  border-radius: 20px;
  padding: 8px 14px;
  gap: 10px;
}

.search-input-box input {
  border: none;
  background: transparent;
  outline: none;
  width: 100%;
  font-size: 14px;
}

.search-results-panel {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.search-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: white;
  border-radius: 10px;
  border: 1px solid var(--bp-border);
  cursor: pointer;
}

.search-item-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.notif-dropdown {
  position: absolute;
  top: 50px;
  right: 16px;
  width: 320px;
  max-width: 90vw;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border: 1px solid var(--bp-border);
  z-index: 1001;
  overflow: hidden;
}

.notif-header {
  padding: 12px 14px;
  background: #f8fafc;
  border-bottom: 1px solid var(--bp-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: 800;
  font-size: 14px;
  color: var(--bp-primary);
}

.notif-header button {
  font-size: 11px;
  color: var(--bp-gold-hover);
  font-weight: 700;
}

.notif-list {
  max-height: 320px;
  overflow-y: auto;
}

.notif-item {
  padding: 12px;
  border-bottom: 1px solid var(--bp-border);
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  background: white;
}

.notif-item.unread {
  background: #f0f7ff;
}

.notif-item:last-child {
  border-bottom: none;
}

.empty-state {
  text-align: center;
  padding: 24px 16px;
  color: var(--bp-muted);
  font-size: 13px;
}

/* =========================================================
   FRIENDS & GROUPS COMPONENTS
========================================================= */
.friends-list, .groups-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 12px;
}

.friend-card, .group-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  padding: 12px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.friend-info, .group-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 12px;
  border-radius: 8px;
  font-weight: 700;
}

/* =========================================================
   VIDEO HUB & CONTROLS
========================================================= */
.video-card {
  background: white;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  overflow: hidden;
  margin-bottom: 14px;
  box-shadow: var(--bp-shadow);
}

.video-container {
  position: relative;
  background: black;
  width: 100%;
  aspect-ratio: 16/9;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.video-info {
  padding: 12px;
}

.video-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--bp-primary);
  margin-bottom: 4px;
}

.video-author {
  font-size: 12px;
  color: var(--bp-muted);
}

/* =========================================================
   PROFILE VIEW, COVER PHOTO & PROFILE PHOTO SYSTEM
========================================================= */
.profile-card {
  background: var(--bp-card-bg);
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
  margin-top: 12px;
  margin-bottom: 20px;
  overflow: hidden;
}

.profile-header-bg {
  height: 180px;
  background: linear-gradient(135deg, var(--bp-primary) 0%, var(--bp-accent) 100%);
  position: relative;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-header-bg.editable {
  cursor: pointer;
}

.profile-header-content {
  padding: 0 16px 16px 16px;
  position: relative;
  text-align: center;
  margin-top: -60px;
}

.profile-avatar-wrapper {
  position: relative;
  width: 110px;
  height: 110px;
  margin: 0 auto 10px auto;
}

.profile-avatar-large {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: var(--bp-primary);
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 40px;
  border: 4px solid white;
  box-shadow: var(--bp-shadow);
  overflow: hidden;
  position: relative;
}

.profile-avatar-large img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.profile-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--bp-primary);
}

.profile-handle {
  font-size: 13px;
  color: var(--bp-muted);
  margin-bottom: 8px;
}

.profile-actions-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(13, 27, 42, 0.6);
  z-index: 3000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(3px);
}

.modal-sheet {
  background: white;
  width: 100%;
  max-width: 640px;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  padding: 20px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  animation: slideUp 0.25s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--bp-primary);
  margin-bottom: 14px;
  text-align: center;
}

/* =========================================================
   BOTTOM MOBILE NAVIGATION
========================================================= */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 54px;
  background: var(--bp-primary);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 2000;
}

.bottom-nav button {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.6);
  font-size: 18px;
}

.bottom-nav button.active {
  color: var(--bp-gold);
}

@media (min-width: 641px) {
  body { padding-bottom: 0; }
  .bottom-nav { display: none; }
}
</style>
</head>

<body>

<!-- HIDDEN FILE INPUTS -->
<input type="file" id="coverPhotoFileInput" accept="image/*" class="hidden">
<input type="file" id="profilePhotoFileInput" accept="image/*" class="hidden">

<!-- =======================================================
     AUTHENTICATION PAGE
======================================================= -->
<div id="auth" class="auth-page">
  <div class="auth">
    <div class="auth-brand">
      <div class="auth-logo"><i class="fa-solid fa-cross"></i></div>
      <div class="brand">Believers<span>+</span></div>
      <div style="color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 2px;">One Faith • One Community</div>
    </div>

    <div class="auth-card">
      <div id="loginBox">
        <h2 style="margin-bottom: 14px; font-size: 18px; color: var(--bp-primary);">Welcome Back</h2>
        <div class="form-group">
          <label>Email Address</label>
          <input id="loginEmail" type="email" placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="loginPass" type="password" placeholder="••••••••">
        </div>
        <button id="loginBtn" class="btn btn-gold" type="button">Log In to Believers+</button>
        <p id="loginMsg" class="msg-error"></p>
        <div class="divider"></div>
        <button id="showSignupBtn" class="btn" type="button">Create Believers+ Account</button>
      </div>

      <div id="signupBox" class="hidden">
        <h2 style="margin-bottom: 14px; font-size: 18px; color: var(--bp-primary);">Join Believers+</h2>
        <div class="form-group">
          <label>Full Name</label>
          <input id="name" type="text" placeholder="John Doe">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input id="email" type="email" placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="pass" type="password" placeholder="••••••••">
        </div>
        <button id="signupBtn" class="btn btn-gold" type="button">Register Account</button>
        <p id="signupMsg" class="msg-error"></p>
        <div class="divider"></div>
        <button id="showLoginBtn" class="btn" type="button">Back to Log In</button>
      </div>
    </div>
  </div>
</div>

<!-- =======================================================
     MAIN APPLICATION VIEW
======================================================= -->
<div id="app" class="hidden">
  <header>
    <div class="header-inner">
      <div class="logo-area" id="brandLogoBtn">
        <div class="logo-icon"><i class="fa-solid fa-cross"></i></div>
        <div class="logo">Believers<span>+</span></div>
      </div>
      <div class="header-actions">
        <button id="notifBellBtn" class="header-circle-btn" title="Notifications">
          <i class="fa-solid fa-bell"></i>
          <span id="notifBadge" class="badge hidden">0</span>
        </button>
        <button id="logoutBtn" class="logout-btn"><i class="fa-solid fa-right-from-bracket"></i> Exit</button>
      </div>
    </div>

    <!-- NOTIFICATION DROPDOWN PANEL -->
    <div id="notifDropdown" class="notif-dropdown hidden">
      <div class="notif-header">
        <span>Notifications</span>
        <button id="markAllReadBtn">Mark all as read</button>
      </div>
      <div id="notifList" class="notif-list"></div>
    </div>

    <div class="nav-wrap">
      <nav class="nav">
        <button id="tabHome" class="active" title="Home Feed"><i class="fa-solid fa-house"></i></button>
        <button id="tabFriends" title="Find Friends"><i class="fa-solid fa-user-plus"></i></button>
        <button id="tabVideos" title="Watch Videos"><i class="fa-solid fa-tv"></i></button>
        <button id="tabGroups" title="Groups"><i class="fa-solid fa-users"></i></button>
      </nav>
    </div>
  </header>

  <main class="wrap" style="padding: 10px 12px;">
    
    <!-- SEARCH BAR SECTION -->
    <div class="search-container">
      <div class="search-input-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--bp-muted);"></i>
        <input type="text" id="globalSearchInput" placeholder="Search friends by name...">
      </div>
      <div id="searchResultsPanel" class="search-results-panel hidden"></div>
    </div>

    <!-- HOME TAB -->
    <div id="viewHome">
      <div class="composer-card">
        <div class="avatar" id="currentUserAvatar">U</div>
        <button id="openComposerBtn" class="mind-button">What's on your mind?</button>
      </div>

      <div id="postComposerArea" class="hidden">
        <textarea id="postText" class="composer-textarea" placeholder="Share a testimony or prayer request..."></textarea>
        <div class="composer-actions">
          <button id="submitPostBtn" class="btn btn-gold btn-sm"><i class="fa-solid fa-paper-plane"></i> Post</button>
        </div>
      </div>

      <div class="stories-container">
        <div class="stories-wrapper" id="storiesList"></div>
      </div>

      <div id="feedList"></div>
    </div>

    <!-- FRIENDS TAB -->
    <div id="viewFriends" class="hidden">
      <h3 style="font-size: 16px; font-weight: 800; color: var(--bp-primary); margin: 10px 0;">Find & Connect with Friends</h3>
      <div id="friendsList" class="friends-list"></div>
    </div>

    <!-- VIDEOS TAB -->
    <div id="viewVideos" class="hidden">
      <h3 style="font-size: 16px; font-weight: 800; color: var(--bp-primary); margin: 10px 0;">Community Video Hub</h3>
      <div id="videoFeedList"></div>
    </div>

    <!-- GROUPS TAB -->
    <div id="viewGroups" class="hidden">
      <div style="display: flex; align-items: center; justify-content: space-between; margin: 10px 0;">
        <h3 style="font-size: 16px; font-weight: 800; color: var(--bp-primary);">Community Groups</h3>
        <button id="openCreateGroupBtn" class="btn btn-gold btn-sm"><i class="fa-solid fa-plus"></i> Create Group</button>
      </div>

      <div id="createGroupModal" class="modal-overlay hidden">
        <div class="modal-sheet">
          <div class="modal-title">Create New Group</div>
          <div class="form-group">
            <label>Group Name</label>
            <input type="text" id="newGroupName" placeholder="e.g. Youth Fellowship">
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="newGroupDesc" rows="3" placeholder="What is this group about?"></textarea>
          </div>
          <button id="saveGroupBtn" class="btn btn-gold" style="margin-bottom: 8px;">Create Group</button>
          <button id="closeGroupModalBtn" class="btn btn-outline modal-cancel-btn">Cancel</button>
        </div>
      </div>

      <div id="groupsList" class="groups-list"></div>
    </div>

    <!-- PROFILE VIEW -->
    <div id="viewProfile" class="hidden">
      <div class="profile-card">
        <div class="profile-header-bg" id="profileHeaderBg"></div>
        <div class="profile-header-content">
          <div class="profile-avatar-wrapper">
            <div class="profile-avatar-large" id="profileAvatarLarge">U</div>
          </div>
          <div class="profile-name" id="profileName">User Name</div>
          <div class="profile-handle" id="profileHandle">@user</div>
          <div class="profile-bio" id="profileBio">Believers+ Community Member</div>
          
          <div class="profile-actions-bar" id="profileActionsBar">
            <button id="profileFriendBtn" class="btn btn-gold btn-sm"><i class="fa-solid fa-user-plus"></i> Add Friend</button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- MOBILE BOTTOM NAV -->
  <div class="bottom-nav">
    <button id="bNavHome" class="active"><i class="fa-solid fa-house"></i></button>
    <button id="bNavFriends"><i class="fa-solid fa-user-plus"></i></button>
    <button id="bNavVideos"><i class="fa-solid fa-tv"></i></button>
    <button id="bNavGroups"><i class="fa-solid fa-users"></i></button>
  </div>
</div>

<script>
/* =========================================================
   APPLICATION STATE & MOCK DATA Persistence
========================================================= */
const state = {
  currentUser: { id: "u_101", name: "Oyantee Weah", handle: "@oyantee", avatar: "O" },
  users: [
    { id: "u_101", name: "Oyantee Weah", handle: "@oyantee", avatar: "O" },
    { id: "u_102", name: "Sarah Jenkins", handle: "@sjenkins", avatar: "S" },
    { id: "u_103", name: "David Miller", handle: "@dmiller", avatar: "D" },
    { id: "u_104", name: "Grace Taylor", handle: "@gtaylor", avatar: "G" }
  ],
  friends: [],
  friendRequests: ["u_102"], // Incoming or sent request tracking
  notifications: [
    { id: 1, text: "Sarah Jenkins sent you a friend request.", read: false, time: "10m ago" },
    { id: 2, text: "David Miller liked your post.", read: false, time: "1h ago" }
  ],
  groups: [
    { id: "g_1", name: "Morning Prayer Warriors", desc: "Daily devotions and fellowship." },
    { id: "g_2", name: "Choir & Worship", desc: "Rehearsal schedules and media sharing." }
  ],
  videos: [
    {
      id: "v_1",
      title: "Sunday Morning Fellowship & Devotion",
      author: "Grace Taylor",
      url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
    },
    {
      id: "v_2",
      title: "Community Outreach Highlights",
      author: "David Miller",
      url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
    }
  ]
};

/* =========================================================
   CORE NAVIGATION & ROUTING SYSTEM
========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  initApp();
});

function initApp() {
  bindAuthEvents();
  bindNavigationEvents();
  bindSearchEvents();
  bindNotificationEvents();
  bindFriendEvents();
  bindGroupEvents();
  bindVideoEvents();

  // Deep-link initial route evaluation
  handleInitialRoute();
}

function handleInitialRoute() {
  const path = window.location.pathname;
  const profileMatch = path.match(/^\/profile\/([^/]+)$/);

  if (profileMatch) {
    const userId = profileMatch[1];
    showApp();
    openUserProfile(userId, false);
  } else {
    showApp();
    switchTab('viewHome');
  }
}

window.addEventListener('popstate', () => {
  const path = window.location.pathname;
  const profileMatch = path.match(/^\/profile\/([^/]+)$/);
  if (profileMatch) {
    openUserProfile(profileMatch[1], false);
  } else {
    switchTab('viewHome', false);
  }
});

/* =========================================================
   UI SWITCHERS
========================================================= */
function showApp() {
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderNotifications();
  renderFriends();
  renderGroups();
  renderVideos();
}

function switchTab(tabId, pushHistory = true) {
  ['viewHome', 'viewFriends', 'viewVideos', 'viewGroups', 'viewProfile'].forEach(id => {
    document.getElementById(id).classList.add('hidden');
  });
  document.getElementById(tabId).classList.remove('hidden');

  // Sync Nav highlight
  const navMap = { viewHome: 'tabHome', viewFriends: 'tabFriends', viewVideos: 'tabVideos', viewGroups: 'tabGroups' };
  const bNavMap = { viewHome: 'bNavHome', viewFriends: 'bNavFriends', viewVideos: 'bNavVideos', viewGroups: 'bNavGroups' };

  document.querySelectorAll('.nav button, .bottom-nav button').forEach(btn => btn.classList.remove('active'));
  if (navMap[tabId]) document.getElementById(navMap[tabId])?.classList.add('active');
  if (bNavMap[tabId]) document.getElementById(bNavMap[tabId])?.classList.add('active');

  if (pushHistory && tabId !== 'viewProfile') {
    history.pushState(null, '', '/');
  }
}

/* =========================================================
   AUTH LOGIC
========================================================= */
function bindAuthEvents() {
  document.getElementById('loginBtn')?.addEventListener('click', () => showApp());
  document.getElementById('signupBtn')?.addEventListener('click', () => showApp());
  document.getElementById('showSignupBtn')?.addEventListener('click', () => {
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('signupBox').classList.remove('hidden');
  });
  document.getElementById('showLoginBtn')?.addEventListener('click', () => {
    document.getElementById('signupBox').classList.add('hidden');
    document.getElementById('loginBox').classList.remove('hidden');
  });
  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    document.getElementById('app').classList.add('hidden');
    document.getElementById('auth').classList.remove('hidden');
  });
  document.getElementById('brandLogoBtn')?.addEventListener('click', () => switchTab('viewHome'));
}

/* =========================================================
   NAVIGATION BINDINGS
========================================================= */
function bindNavigationEvents() {
  document.getElementById('tabHome')?.addEventListener('click', () => switchTab('viewHome'));
  document.getElementById('tabFriends')?.addEventListener('click', () => switchTab('viewFriends'));
  document.getElementById('tabVideos')?.addEventListener('click', () => switchTab('viewVideos'));
  document.getElementById('tabGroups')?.addEventListener('click', () => switchTab('viewGroups'));

  document.getElementById('bNavHome')?.addEventListener('click', () => switchTab('viewHome'));
  document.getElementById('bNavFriends')?.addEventListener('click', () => switchTab('viewFriends'));
  document.getElementById('bNavVideos')?.addEventListener('click', () => switchTab('viewVideos'));
  document.getElementById('bNavGroups')?.addEventListener('click', () => switchTab('viewGroups'));
}

/* =========================================================
   1. FIND FRIENDS / FRIENDS SYSTEM
========================================================= */
function bindFriendEvents() {
  // Handled dynamically via renderFriends
}

function renderFriends() {
  const container = document.getElementById('friendsList');
  if (!container) return;

  const availableUsers = state.users.filter(u => u.id !== state.currentUser.id);
  
  if (availableUsers.length === 0) {
    container.innerHTML = `<div class="empty-state">No available members found.</div>`;
    return;
  }

  container.innerHTML = availableUsers.map(user => {
    const isFriend = state.friends.includes(user.id);
    const isRequested = state.friendRequests.includes(user.id);

    let btnHtml = '';
    if (isFriend) {
      btnHtml = `<button class="btn btn-outline btn-sm" disabled><i class="fa-solid fa-check"></i> Friends</button>`;
    } else if (isRequested) {
      btnHtml = `<button class="btn btn-outline btn-sm" disabled><i class="fa-solid fa-clock"></i> Requested</button>`;
    } else {
      btnHtml = `<button class="btn btn-gold btn-sm" onclick="sendFriendRequest('${user.id}')"><i class="fa-solid fa-user-plus"></i> Add Friend</button>`;
    }

    return `
      <div class="friend-card">
        <div class="friend-info" onclick="openUserProfile('${user.id}')" style="cursor: pointer;">
          <div class="avatar">${user.avatar}</div>
          <div>
            <div style="font-weight: 800; font-size: 14px; color: var(--bp-primary);">${user.name}</div>
            <div style="font-size: 12px; color: var(--bp-muted);">${user.handle}</div>
          </div>
        </div>
        <div>${btnHtml}</div>
      </div>
    `;
  }).join('');
}

function sendFriendRequest(userId) {
  if (!state.friendRequests.includes(userId) && !state.friends.includes(userId)) {
    state.friendRequests.push(userId);
    renderFriends();
  }
}

/* =========================================================
   2. SEARCH SYSTEM
========================================================= */
function bindSearchEvents() {
  const searchInput = document.getElementById('globalSearchInput');
  const resultsPanel = document.getElementById('searchResultsPanel');

  searchInput?.addEventListener('input', (e) => {
    const query = e.target.value.trim().toLowerCase();
    if (!query) {
      resultsPanel.classList.add('hidden');
      resultsPanel.innerHTML = '';
      return;
    }

    const matchedUsers = state.users.filter(u => u.name.toLowerCase().includes(query) || u.handle.toLowerCase().includes(query));
    resultsPanel.classList.remove('hidden');

    if (matchedUsers.length === 0) {
      resultsPanel.innerHTML = `<div class="empty-state">No results found for "${query}"</div>`;
      return;
    }

    resultsPanel.innerHTML = matchedUsers.map(u => `
      <div class="search-item" onclick="openUserProfile('${u.id}'); clearSearch();">
        <div class="search-item-info">
          <div class="avatar">${u.avatar}</div>
          <div>
            <div style="font-weight: 700; font-size: 13px; color: var(--bp-primary);">${u.name}</div>
            <div style="font-size: 11px; color: var(--bp-muted);">${u.handle}</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: var(--bp-muted);"></i>
      </div>
    `).join('');
  });
}

function clearSearch() {
  const searchInput = document.getElementById('globalSearchInput');
  const resultsPanel = document.getElementById('searchResultsPanel');
  if (searchInput) searchInput.value = '';
  if (resultsPanel) {
    resultsPanel.classList.add('hidden');
    resultsPanel.innerHTML = '';
  }
}

/* =========================================================
   3. NOTIFICATIONS 🔔 SYSTEM
========================================================= */
function bindNotificationEvents() {
  const bellBtn = document.getElementById('notifBellBtn');
  const dropdown = document.getElementById('notifDropdown');
  const markAllBtn = document.getElementById('markAllReadBtn');

  bellBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdown.classList.toggle('hidden');
  });

  document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target) && !bellBtn.contains(e.target)) {
      dropdown.classList.add('hidden');
    }
  });

  markAllBtn?.addEventListener('click', () => {
    state.notifications.forEach(n => n.read = true);
    renderNotifications();
  });
}

function renderNotifications() {
  const list = document.getElementById('notifList');
  const badge = document.getElementById('notifBadge');
  if (!list || !badge) return;

  const unreadCount = state.notifications.filter(n => !n.read).length;
  if (unreadCount > 0) {
    badge.textContent = unreadCount;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }

  if (state.notifications.length === 0) {
    list.innerHTML = `<div class="empty-state">No notifications.</div>`;
    return;
  }

  list.innerHTML = state.notifications.map(n => `
    <div class="notif-item ${n.read ? '' : 'unread'}" onclick="markNotifRead(${n.id})">
      <i class="fa-solid fa-circle-info" style="color: var(--bp-gold);"></i>
      <div style="flex: 1;">
        <div style="font-size: 12px; color: var(--bp-text);">${n.text}</div>
        <div style="font-size: 10px; color: var(--bp-muted); margin-top: 2px;">${n.time}</div>
      </div>
    </div>
  `).join('');
}

function markNotifRead(id) {
  const notif = state.notifications.find(n => n.id === id);
  if (notif) {
    notif.read = true;
    renderNotifications();
  }
}

/* =========================================================
   4. CREATE GROUP (+) SYSTEM
========================================================= */
function bindGroupEvents() {
  const openBtn = document.getElementById('openCreateGroupBtn');
  const closeBtn = document.getElementById('closeGroupModalBtn');
  const saveBtn = document.getElementById('saveGroupBtn');
  const modal = document.getElementById('createGroupModal');

  openBtn?.addEventListener('click', () => modal.classList.remove('hidden'));
  closeBtn?.addEventListener('click', () => modal.classList.add('hidden'));

  saveBtn?.addEventListener('click', () => {
    const name = document.getElementById('newGroupName').value.trim();
    const desc = document.getElementById('newGroupDesc').value.trim();

    if (!name) return;

    state.groups.push({
      id: `g_${Date.now()}`,
      name,
      desc: desc || "Community Group"
    });

    document.getElementById('newGroupName').value = '';
    document.getElementById('newGroupDesc').value = '';
    modal.classList.add('hidden');
    renderGroups();
  });
}

function renderGroups() {
  const container = document.getElementById('groupsList');
  if (!container) return;

  container.innerHTML = state.groups.map(g => `
    <div class="group-card">
      <div class="group-info">
        <div class="avatar" style="border-radius: 10px;"><i class="fa-solid fa-users"></i></div>
        <div>
          <div style="font-weight: 800; font-size: 14px; color: var(--bp-primary);">${g.name}</div>
          <div style="font-size: 12px; color: var(--bp-muted);">${g.desc}</div>
        </div>
      </div>
      <button class="btn btn-outline btn-sm">Join</button>
    </div>
  `).join('');
}

/* =========================================================
   5. VIDEOS ▶️ HUB SYSTEM
========================================================= */
function bindVideoEvents() {
  // Handled dynamically via renderVideos
}

function renderVideos() {
  const container = document.getElementById('videoFeedList');
  if (!container) return;

  container.innerHTML = state.videos.map(v => `
    <div class="video-card">
      <div class="video-container">
        <video controls preload="metadata">
          <source src="${v.url}" type="video/mp4">
          Your browser does not support video playback.
        </video>
      </div>
      <div class="video-info">
        <div class="video-title">${v.title}</div>
        <div class="video-author">Shared by ${v.author}</div>
      </div>
    </div>
  `).join('');
}

/* =========================================================
   PROFILE NAVIGATION HANDLER
========================================================= */
function openUserProfile(userId, pushHistory = true) {
  const user = state.users.find(u => u.id === userId) || {
    id: userId,
    name: "Member Profile",
    handle: "@member",
    avatar: "M"
  };

  document.getElementById('profileName').textContent = user.name;
  document.getElementById('profileHandle').textContent = user.handle;
  document.getElementById('profileAvatarLarge').textContent = user.avatar;

  const friendBtn = document.getElementById('profileFriendBtn');
  if (userId === state.currentUser.id) {
    friendBtn.classList.add('hidden');
  } else {
    friendBtn.classList.remove('hidden');
    const isFriend = state.friends.includes(userId);
    const isRequested = state.friendRequests.includes(userId);

    if (isFriend) {
      friendBtn.innerHTML = `<i class="fa-solid fa-check"></i> Friends`;
      friendBtn.disabled = true;
    } else if (isRequested) {
      friendBtn.innerHTML = `<i class="fa-solid fa-clock"></i> Requested`;
      friendBtn.disabled = true;
    } else {
      friendBtn.innerHTML = `<i class="fa-solid fa-user-plus"></i> Add Friend`;
      friendBtn.disabled = false;
      friendBtn.onclick = () => {
        sendFriendRequest(userId);
        openUserProfile(userId, false);
      };
    }
  }

  if (pushHistory) {
    history.pushState({ userId }, '', `/profile/${userId}`);
  }

  switchTab('viewProfile', false);
}
</script>
</body>
</html>
