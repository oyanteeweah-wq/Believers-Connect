<script>
  // Elements
  const authContainer = document.getElementById('auth');
  const appContainer = document.getElementById('app');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginEmail = document.getElementById('loginEmail');
  const loginPass = document.getElementById('loginPass');
  const loginMsg = document.getElementById('loginMsg');
  const mindBtn = document.getElementById('mindBtn');
  const cancelPostBtn = document.getElementById('cancelPostBtn');
  const postComposerArea = document.getElementById('postComposerArea');

  // Check login state on load
  function checkSession() {
    const isLoggedIn = localStorage.getItem('isLoggedIn');
    if (isLoggedIn === 'true') {
      authContainer.classList.add('hidden');
      appContainer.classList.remove('hidden');
    } else {
      authContainer.classList.remove('hidden');
      appContainer.classList.add('hidden');
    }
  }

  // Login handler with basic validation
  loginBtn.addEventListener('click', () => {
    const email = loginEmail.value.trim();
    const pass = loginPass.value.trim();

    if (!email || !pass) {
      loginMsg.textContent = "Please enter both email and password.";
      return;
    }

    loginMsg.textContent = "";
    localStorage.setItem('isLoggedIn', 'true');
    checkSession();
  });

  // Logout handler
  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('isLoggedIn');
    loginEmail.value = "";
    loginPass.value = "";
    checkSession();
  });

  // Composer toggles
  mindBtn.addEventListener('click', () => {
    postComposerArea.classList.remove('hidden');
  });

  cancelPostBtn.addEventListener('click', () => {
    postComposerArea.classList.add('hidden');
  });

  // Tab switcher
  function tab(tabName) {
    document.querySelectorAll('.nav button').forEach(btn => btn.classList.remove('active'));
    const selectedTab = document.querySelector(`.nav button[data-tab="${tabName}"]`);
    if(selectedTab) selectedTab.classList.add('active');
  }

  // Run session check on page load
  checkSession();
</script>
