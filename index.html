<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1b2a">
<meta name="description" content="Believers+ — Empowering Faith, Fellowship & Community">
<title>Believers+</title>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* =========================================================
   BELIEVERS+ DESIGN SYSTEM & THEME
========================================================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

:root {
  --bp-primary: #0d1b2a;       /* Deep Sapphire */
  --bp-accent: #1b263b;        /* Midnight Blue */
  --bp-gold: #e0a96d;          /* Radiant Gold */
  --bp-gold-hover: #c89355;
  --bp-bg: #f4f6f9;            /* Soft Pearl White */
  --bp-card-bg: #ffffff;
  --bp-text: #1b1e23;
  --bp-muted: #6c757d;
  --bp-icon-bg: #e9ecef;
  --bp-border: #e2e8f0;
  --bp-radius: 14px;
  --bp-shadow: 0 4px 12px rgba(13, 27, 42, 0.05);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bp-bg);
  color: var(--bp-text);
  line-height: 1.5;
  padding-bottom: 70px;
}

button, input, textarea, select {
  font: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

img {
  max-width: 100%;
  display: block;
}

.hidden {
  display: none !important;
}

.wrap {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
}

/* =========================================================
   AUTHENTICATION VIEW
========================================================= */
.auth-page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
  color: white;
}

.auth {
  width: 100%;
  max-width: 410px;
}

.auth-brand {
  text-align: center;
  margin-bottom: 24px;
}

.auth-logo {
  font-size: 52px;
  color: var(--bp-gold);
  margin-bottom: 4px;
}

.brand {
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: white;
}

.brand span {
  color: var(--bp-gold);
}

.auth-card {
  background: white;
  border-radius: 18px;
  padding: 24px;
  color: var(--bp-text);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--bp-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
}

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--bp-border);
  border-radius: 10px;
  background: #f8fafc;
  outline: none;
  transition: border-color 0.2s;
  color: var(--bp-text);
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  border-color: var(--bp-gold);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 18px;
  border-radius: 10px;
  background: var(--bp-primary);
  color: white;
  font-weight: 700;
  width: 100%;
  font-size: 15px;
  transition: opacity 0.2s;
}

.btn:active {
  opacity: 0.9;
}

.btn-gold {
  background: var(--bp-gold);
  color: var(--bp-primary);
}

.btn-gold:hover {
  background: var(--bp-gold-hover);
}

.btn-outline {
  background: transparent;
  border: 1px solid var(--bp-border);
  color: var(--bp-primary);
}

.divider {
  height: 1px;
  background: var(--bp-border);
  margin: 18px 0;
}

.msg-error {
  color: #e63946;
  margin-top: 10px;
  font-size: 13px;
  text-align: center;
  font-weight: 600;
}

/* =========================================================
   HEADER & NAVIGATION
========================================================= */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.header-inner {
  max-width: 640px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo-area {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.logo-icon {
  font-size: 22px;
  color: var(--bp-gold);
}

.logo {
  font-size: 22px;
  font-weight: 900;
  color: var(--bp-primary);
  letter-spacing: -0.5px;
}

.logo span {
  color: var(--bp-gold);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.header-circle-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bp-icon-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--bp-primary);
  transition: background 0.2s;
}

.logout-btn {
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 8px;
  background: rgba(230, 57, 70, 0.1);
  color: #e63946;
}

.nav-wrap {
  background: #ffffff;
  border-bottom: 1px solid var(--bp-border);
}

.nav {
  display: flex;
  justify-content: space-around;
  align-items: center;
  max-width: 640px;
  margin: 0 auto;
}

.nav button {
  flex: 1;
  padding: 12px 0;
  font-size: 18px;
  color: var(--bp-muted);
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: color 0.2s;
}

.nav button.active {
  color: var(--bp-gold);
  border-bottom: 3px solid var(--bp-gold);
}

.badge {
  position: absolute;
  top: 6px;
  right: 22%;
  background: #e63946;
  color: white;
  font-size: 10px;
  font-weight: bold;
  padding: 1px 5px;
  border-radius: 8px;
}

/* =========================================================
   COMPOSER / CREATE POST AREA
========================================================= */
.composer-card {
  background: var(--bp-card-bg);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
  margin-bottom: 10px;
  border-radius: var(--bp-radius);
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--bp-primary), var(--bp-accent));
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 16px;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid var(--bp-gold);
  cursor: pointer;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.mind-button {
  flex: 1;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  border-radius: 25px;
  padding: 10px 16px;
  color: var(--bp-muted);
  font-size: 14px;
  text-align: left;
}

.photo-upload-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--bp-gold);
  font-size: 18px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  background: #fff8f0;
}

.photo-upload-btn span {
  font-size: 12px;
  color: var(--bp-primary);
  font-weight: 700;
}

#postComposerArea {
  background: white;
  padding: 14px;
  margin-bottom: 12px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.composer-textarea {
  width: 100%;
  border: none;
  outline: none;
  font-size: 15px;
  resize: none;
  min-height: 85px;
}

.composer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--bp-border);
  padding-top: 10px;
}

.post-image-preview {
  position: relative;
  margin: 8px 0;
}

.post-image-preview img {
  max-height: 220px;
  border-radius: 10px;
  width: 100%;
  object-fit: cover;
}

.remove-post-image {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(13, 27, 42, 0.8);
  color: white;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-weight: bold;
}

/* =========================================================
   COMMUNITY UPDATES / STORIES
========================================================= */
.stories-container {
  background: transparent;
  margin-bottom: 12px;
  overflow-x: auto;
  white-space: nowrap;
  scrollbar-width: none;
  padding: 2px 0;
}

.stories-container::-webkit-scrollbar {
  display: none;
}

.stories-wrapper {
  display: inline-flex;
  gap: 10px;
}

.story-card {
  width: 110px;
  height: 175px;
  border-radius: 14px;
  position: relative;
  overflow: hidden;
  background: var(--bp-primary);
  flex-shrink: 0;
  box-shadow: var(--bp-shadow);
  border: 1px solid var(--bp-border);
  cursor: pointer;
}

.story-card img.bg-story {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.85;
}

.story-card .story-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(13, 27, 42, 0.9) 0%, transparent 60%);
}

.story-card .story-author {
  position: absolute;
  bottom: 8px;
  left: 8px;
  right: 8px;
  color: white;
  font-size: 11px;
  font-weight: 700;
  white-space: normal;
  line-height: 1.2;
}

.story-card .story-badge {
  position: absolute;
  top: 8px;
  left: 8px;
  background: var(--bp-gold);
  color: var(--bp-primary);
  font-size: 10px;
  font-weight: 900;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.story-card.create-story {
  background: white;
  display: flex;
  flex-direction: column;
}

.story-card.create-story .top-img {
  height: 115px;
  width: 100%;
  position: relative;
  background: #f1f5f9;
}

.story-card.create-story .top-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.story-card.create-story .plus-btn {
  position: absolute;
  bottom: -13px;
  left: 50%;
  transform: translateX(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bp-gold);
  color: var(--bp-primary);
  border: 2px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
}

.story-card.create-story .bottom-text {
  height: 60px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  font-size: 11px;
  font-weight: 800;
  color: var(--bp-primary);
  text-align: center;
}

/* =========================================================
   FEED POST CARDS
========================================================= */
.card {
  background: var(--bp-card-bg);
  margin-bottom: 12px;
  padding: 14px;
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
}

.posthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.posthead-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.clickable-user {
  cursor: pointer;
}

.clickable-user:hover {
  text-decoration: underline;
}

.post-author-name {
  font-weight: 800;
  font-size: 14px;
  color: var(--bp-primary);
}

.post-meta-line {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--bp-muted);
}

.post-content {
  font-size: 14px;
  margin-bottom: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.post-photo {
  width: 100%;
  max-height: 450px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 10px;
}

.actions {
  display: flex;
  align-items: center;
  justify-content: space-around;
  border-top: 1px solid var(--bp-border);
  padding-top: 8px;
  margin-top: 4px;
}

.action-btn {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 0;
  color: var(--bp-muted);
  font-size: 13px;
  font-weight: 700;
  border-radius: 6px;
}

.action-btn.liked {
  color: var(--bp-gold);
}

/* =========================================================
   PROFILE VIEW, COVER PHOTO & PROFILE PHOTO SYSTEM
========================================================= */
.profile-card {
  background: var(--bp-card-bg);
  border-radius: var(--bp-radius);
  border: 1px solid var(--bp-border);
  box-shadow: var(--bp-shadow);
  margin-top: 12px;
  margin-bottom: 20px;
  overflow: hidden;
}

.profile-header-bg {
  height: 180px;
  background: linear-gradient(135deg, var(--bp-primary) 0%, var(--bp-accent) 100%);
  position: relative;
  background-size: cover;
  background-position: center;
  display: flex;
  align-items: center;
  justify-content: center;
}

.profile-header-bg.editable {
  cursor: pointer;
}

.cover-upload-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: var(--bp-gold);
  background: rgba(13, 27, 42, 0.5);
  padding: 10px 18px;
  border-radius: 20px;
  border: 1px dashed var(--bp-gold);
  font-size: 13px;
  font-weight: 700;
  transition: background 0.2s;
}

.cover-upload-placeholder:hover {
  background: rgba(13, 27, 42, 0.75);
}

.cover-action-badge {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: rgba(13, 27, 42, 0.85);
  color: white;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.profile-header-content {
  padding: 0 16px 16px 16px;
  position: relative;
  text-align: center;
  margin-top: -60px;
}

.profile-avatar-wrapper {
  position: relative;
  width: 110px;
  height: 110px;
  margin: 0 auto 10px auto;
}

.profile-avatar-large {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: var(--bp-primary);
  color: var(--bp-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 40px;
  border: 4px solid white;
  box-shadow: var(--bp-shadow);
  overflow: hidden;
  position: relative;
}

.profile-avatar-large.editable {
  cursor: pointer;
}

.profile-avatar-large img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.avatar-upload-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  background: var(--bp-accent);
  color: var(--bp-gold);
  font-size: 10px;
  font-weight: 700;
  text-align: center;
  padding: 4px;
}

.avatar-upload-placeholder i {
  font-size: 24px;
  margin-bottom: 2px;
}

.avatar-edit-badge {
  position: absolute;
  bottom: 4px;
  right: 4px;
  background: var(--bp-gold);
  color: var(--bp-primary);
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid white;
  font-size: 13px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  cursor: pointer;
}

.profile-name {
  font-size: 20px;
  font-weight: 800;
  color: var(--bp-primary);
}

.profile-handle {
  font-size: 13px;
  color: var(--bp-muted);
  margin-bottom: 8px;
}

.profile-bio {
  font-size: 14px;
  color: var(--bp-text);
  max-width: 450px;
  margin: 0 auto 14px auto;
}

.profile-actions-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
}

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(13, 27, 42, 0.6);
  z-index: 3000;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  backdrop-filter: blur(3px);
}

.modal-sheet {
  background: white;
  width: 100%;
  max-width: 640px;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  padding: 20px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
  animation: slideUp 0.25s ease-out;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.modal-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--bp-primary);
  margin-bottom: 14px;
  text-align: center;
}

.modal-option-btn {
  width: 100%;
  padding: 12px 16px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  font-size: 14px;
  color: var(--bp-primary);
  margin-bottom: 8px;
  background: #f8fafc;
  border: 1px solid var(--bp-border);
  transition: background 0.15s;
}

.modal-option-btn:hover {
  background: #f1f5f9;
}

.modal-option-btn.danger {
  color: #e63946;
  background: rgba(230, 57, 70, 0.05);
  border-color: rgba(230, 57, 70, 0.2);
}

.modal-cancel-btn {
  margin-top: 6px;
  background: transparent;
  border: none;
  color: var(--bp-muted);
}

.profile-section {
  padding: 16px;
  border-top: 1px solid var(--bp-border);
}

.profile-section-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--bp-gold);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 10px;
}

.info-item {
  background: #f8fafc;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--bp-border);
}

.info-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--bp-muted);
  text-transform: uppercase;
}

.info-val {
  font-size: 13px;
  font-weight: 600;
  color: var(--bp-primary);
  margin-top: 2px;
}

.private-locked {
  font-size: 12px;
  color: var(--bp-muted);
  font-style: italic;
  display: flex;
  align-items: center;
  gap: 4px;
}

.privacy-select {
  font-size: 11px;
  padding: 4px;
  margin-top: 4px;
}

/* =========================================================
   BOTTOM MOBILE NAVIGATION
========================================================= */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 54px;
  background: var(--bp-primary);
  border-top: 1px solid rgba(255,255,255,0.1);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 2000;
}

.bottom-nav button {
  flex: 1;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.6);
  font-size: 18px;
}

.bottom-nav button.active {
  color: var(--bp-gold);
}

@media (min-width: 641px) {
  body { padding-bottom: 0; }
  .bottom-nav { display: none; }
}
</style>
</head>

<body>

<!-- HIDDEN FILE INPUTS -->
<input type="file" id="coverPhotoFileInput" accept="image/*" class="hidden">
<input type="file" id="profilePhotoFileInput" accept="image/*" class="hidden">

<!-- =======================================================
     AUTHENTICATION PAGE
======================================================= -->
<div id="auth" class="auth-page">
  <div class="auth">
    <div class="auth-brand">
      <div class="auth-logo"><i class="fa-solid fa-cross"></i></div>
      <div class="brand">Believers<span>+</span></div>
      <div style="color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 2px;">One Faith • One Community</div>
    </div>

    <div class="auth-card">
      <div id="loginBox">
        <h2 style="margin-bottom: 14px; font-size: 18px; color: var(--bp-primary);">Welcome Back</h2>
        <div class="form-group">
          <label>Email Address</label>
          <input id="loginEmail" type="email" placeholder="name@domain.com">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="loginPass" type="password" placeholder="••••••••">
        </div>
        <button id="loginBtn" class="btn btn-gold" type="button">Log In to Believers+</button>
        <p id="loginMsg" class="msg-error"></p>
        <div class="divider"></div>
        <button id="showSignupBtn" class="btn" type="button">Create Believers+ Account</button>
      </div>

      coverImg: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?auto=format&fit=crop&w=800&q=80",
      bio: "Serving through visual arts and media ministry.",
      dob: "1992-03-22",

      coverImg: "",
      bio: "Worshipper, prayer group coordinator, and choir member.",

      privacy: { dob: "only_me", address: "only_me", phone: "only_me", email: "members", education: "public", employment: "public", church: "public" }
    }
  };

  let stories = [
    { id: "s_1", userId: "u_101", count: 0 },
    { id: "s_2", userId: "u_103", count: 2 },
    { id: "s_3", userId: "u_102", count: 1 }
  ];

  let posts = [
    {
      id: "p_1",
      userId: "u_102",
      time: "2 hours ago",
      status: "blessed at Grace Community",
      content: "Blessed Sunday to everyone! Excited to share our community graphic updates with the fellowship today.",
      image: "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=600&q=80",
      likes: 12,
      isLiked: false
    }
  ];

  document.addEventListener('DOMContentLoaded', () => {
    const savedUsers = localStorage.getItem('bp_users');
    if (savedUsers) {
      try { usersDb = JSON.parse(savedUsers); } catch(e){}
    }

    document.getElementById('showSignupBtn').addEventListener('click', () => {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('signupBox').classList.remove('hidden');
      clearMsgs();
    });

    document.getElementById('showLoginBtn').addEventListener('click', () => {
      document.getElementById('signupBox').classList.add('hidden');
      document.getElementById('loginBox').classList.remove('hidden');
      clearMsgs();
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      const msg = document.getElementById('loginMsg');

      if (!email || !pass) {
        msg.textContent = "Please provide email and password.";
        return;
      }

      let user = Object.values(usersDb).find(u => u.email === email);
      if (!user) {
        const newId = 'u_' + Date.now();
        const derivedName = email.split('@')[0];
        usersDb[newId] = {
          id: newId,
          name: derivedName,
          username: derivedName.toLowerCase().replace(/[^a-z0-9]/g, ''),
          email: email,
          avatarImg: "",
          coverImg: "",
          bio: "New Believers+ community member.",
          privacy: { dob: 'members', address: 'only_me', phone: 'members', email: 'members', education: 'public', employment: 'public', church: 'public' }
        };
        currentUserId = newId;
        saveDb();
      } else {
        currentUserId = user.id;
      }

      loginUser();
    });

    document.getElementById('signupBtn').addEventListener('click', () => {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('pass').value.trim();
      const msg = document.getElementById('signupMsg');

      if (!name || !email || !pass) {
        msg.textContent = "Please complete all fields.";
        return;
      }

      const newId = 'u_' + Date.now();
      usersDb[newId] = {
        id: newId,
        name: name,
        username: name.toLowerCase().replace(/[^a-z0-9]/g, ''),
        email: email,
        avatarImg: "",
        coverImg: "",
        bio: "Member of Believers+ fellowship.",
        privacy: { dob: 'members', address: 'only_me', phone: 'members', email: 'members', education: 'public', employment: 'public', church: 'public' }
      };
      currentUserId = newId;
      saveDb();
      loginUser();
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.getElementById('app').classList.add('hidden');
      document.getElementById('auth').classList.remove('hidden');
      document.getElementById('loginEmail').value = '';
      document.getElementById('loginPass').value = '';
      clearMsgs();
    });

    // Image Upload Handling in Composer
    const postImageInput = document.getElementById('postImageInput');
    postImageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          attachedImageBase64 = evt.target.result;
          document.getElementById('previewImg').src = attachedImageBase64;
          document.getElementById('postImagePreview').classList.remove('hidden');
          document.getElementById('postComposerArea').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('removeImageBtn').addEventListener('click', () => {
      attachedImageBase64 = null;
      document.getElementById('postImageInput').value = '';
      document.getElementById('postImagePreview').classList.add('hidden');
    });

    document.getElementById('submitPostBtn').addEventListener('click', () => {
      const text = document.getElementById('postText').value.trim();
      if (!text && !attachedImageBase64) return;

      const newPost = {
        id: 'p_' + Date.now(),
        userId: currentUserId,
        time: "Just now",
        status: "sharing with community",
        content: text,
        image: attachedImageBase64,
        likes: 0,
        isLiked: false
      };

      posts.unshift(newPost);
      renderFeed();

      document.getElementById('postText').value = '';
      attachedImageBase64 = null;
      document.getElementById('postImageInput').value = '';
      document.getElementById('postImagePreview').classList.add('hidden');
      document.getElementById('postComposerArea').classList.add('hidden');
    });

    // File Input Listeners
    const coverFileInput = document.getElementById('coverPhotoFileInput');
    coverFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        const previewUrl = await readFileAsBase64(file);
        await uploadCoverPhotoToSupabase(currentUserId, file, previewUrl);
        saveDb();
        updateComposerAvatar();
        if (activeProfileViewUserId === currentUserId) {
          openProfile(currentUserId, false);
        }
      }
      coverFileInput.value = '';
    });

    const profileFileInput = document.getElementById('profilePhotoFileInput');
    profileFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        const previewUrl = await readFileAsBase64(file);
        await uploadProfilePhotoToSupabase(currentUserId, file, previewUrl);
        saveDb();
        updateComposerAvatar();
        if (activeProfileViewUserId === currentUserId) {
          openProfile(currentUserId, false);
        }
      }
      profileFileInput.value = '';
    });

    // Automatically initialize view or handle directly navigated URL
    loginUser();
  });

  // DEEP-LINK INITIALIZATION & ROUTING RESOLUTION
  function initRouteFromURL() {
    const path = window.location.pathname;
    const profileMatch = path.match(/^\/profile\/([^/]+)\/?$/);

    if (profileMatch && profileMatch[1]) {
      const targetUserId = profileMatch[1];
      if (usersDb[targetUserId]) {
        openProfile(targetUserId, false);
      } else {
        navigateHome(false);
      }
    } else {
      navigateHome(false);
    }
  }

  window.addEventListener('popstate', (e) => {
    if (e.state && e.state.profileId) {
      openProfile(e.state.profileId, false);
    } else {
      navigateHome(false);
    }
  });

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = (err) => reject(err);
      reader.readAsDataURL(file);
    });
  }

  async function uploadCoverPhotoToSupabase(userId, fileObject, previewBase64) {
    usersDb[userId].coverImg = previewBase64;
  }

  async function uploadProfilePhotoToSupabase(userId, fileObject, previewBase64) {
    usersDb[userId].avatarImg = previewBase64;
  }

  function saveDb() {
    localStorage.setItem('bp_users', JSON.stringify(usersDb));
  }

  function loginUser() {
    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    
    updateComposerAvatar();
    initRouteFromURL();
  }

  function updateComposerAvatar() {
    const user = usersDb[currentUserId];
    const headerAvatarEl = document.getElementById('headerAvatar');
    headerAvatarEl.onclick = () => openProfile(currentUserId);

    if (user && user.avatarImg) {
      headerAvatarEl.innerHTML = `<img src="${user.avatarImg}" alt="${user.name}" onerror="handleImageError(this)">`;
    } else {
      headerAvatarEl.textContent = (user ? user.name : "B").charAt(0).toUpperCase();
    }
  }

  function clearMsgs() {
    document.getElementById('loginMsg').textContent = '';
    document.getElementById('signupMsg').textContent = '';
  }

  function toggleComposer() {
    const area = document.getElementById('postComposerArea');
    area.classList.toggle('hidden');
  }

  function navigateHome(shouldPushState = true) {
    activeProfileViewUserId = null;
    document.getElementById('profileView').classList.add('hidden');
    document.getElementById('feedView').classList.remove('hidden');
    
    document.getElementById('navHomeBtn').classList.add('active');
    document.getElementById('bNavHome').classList.add('active');
    document.getElementById('bNavProfile').classList.remove('active');
    
    renderStories();
    renderFeed();

    if (shouldPushState && window.location.pathname !== '/') {
      window.history.pushState({}, '', '/');
    }
  }

  function switchTab(tabName) {
    if (tabName === 'home') {
      navigateHome();
    } else {
      alert(`The ${tabName.toUpperCase()} section is active on your feed.`);
    }
  }

  function renderStories() {
    const wrapper = document.getElementById('storiesWrapper');
    wrapper.innerHTML = '';

    stories.forEach(story => {
      const user = usersDb[story.userId] || { name: 'Member', avatarImg: '' };
      const isSelf = story.userId === currentUserId;

      const card = document.createElement('div');
      card.className = `story-card ${isSelf ? 'create-story' : ''}`;
      card.onclick = () => openProfile(story.userId);

      if (isSelf) {
        card.innerHTML = `
          <div class="top-img">
            <img src="${user.avatarImg || svgPlaceholder}" alt="${user.name}" onerror="handleImageError(this)">
            <div class="plus-btn"><i class="fa-solid fa-plus"></i></div>
          </div>
          <div class="bottom-text">Update Story</div>
        `;
      } else {
        card.innerHTML = `
          ${story.count > 0 ? `<div class="story-badge">${story.count}</div>` : ''}
          <img class="bg-story" src="${user.avatarImg || svgPlaceholder}" alt="${user.name}" onerror="handleImageError(this)">
          <div class="story-overlay"></div>
          <div class="story-author">${user.name}</div>
        `;
      }

      wrapper.appendChild(card);
    });
  }

  function renderFeed() {
    const feedContainer = document.getElementById('feedContainer');
    feedContainer.innerHTML = '';

    posts.forEach(post => {
      const author = usersDb[post.userId] || { name: 'Believers+ Member', avatarImg: '' };
      const initial = author.name.charAt(0).toUpperCase();

      const card = document.createElement('div');
      card.className = 'card';
      
      const avatarHTML = author.avatarImg 
        ? `<div class="avatar" onclick="openProfile('${author.id}')"><img src="${author.avatarImg}" alt="${author.name}" onerror="handleImageError(this)"></div>`
        : `<div class="avatar" onclick="openProfile('${author.id}')">${initial}</div>`;

      card.innerHTML = `
        <div class="posthead">
          <div class="posthead-left">
            ${avatarHTML}
            <div>
              <div class="post-author-name clickable-user" onclick="openProfile('${author.id}')">${author.name}</div>
              <div class="post-meta-line">
                <span>${post.time}</span> • <span>${post.status}</span>
              </div>
            </div>
          </div>
          <button style="color:var(--bp-muted);"><i class="fa-solid fa-ellipsis-vertical"></i></button>
        </div>
        ${post.content ? `<div class="post-content">${post.content}</div>` : ''}
        ${post.image ? `<img class="post-photo" src="${post.image}" alt="Community Post" onerror="handleImageError(this)">` : ''}
        <div class="actions">
          <button class="action-btn ${post.isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}')">
            <i class="${post.isLiked ? 'fa-solid' : 'fa-heart'} fa-heart"></i> 
            ${post.likes > 0 ? post.likes : ''} Encourage
          </button>
          <button class="action-btn"><i class="fa-regular fa-comment-dots"></i> Reply</button>
          <button class="action-btn"><i class="fa-solid fa-arrow-share-group"></i> Share</button>
        </div>
      `;

      feedContainer.appendChild(card);
    });
  }

  function toggleLike(postId) {
    const post = posts.find(p => p.id === postId);
    if (post) {
      post.isLiked = !post.isLiked;
      post.likes += post.isLiked ? 1 : -1;
      renderFeed();
    }
  }

  function openProfile(userId, shouldPushState = true) {
    const user = usersDb[userId];
    if (!user) return;

    activeProfileViewUserId = userId;

    if (shouldPushState) {
      window.history.pushState({ profileId: userId }, '', `/profile/${user.id}`);
    }

    document.getElementById('feedView').classList.add('hidden');
    const profileView = document.getElementById('profileView');
    profileView.classList.remove('hidden');

    document.getElementById('navHomeBtn').classList.remove('active');
    document.getElementById('bNavHome').classList.remove('active');
    if (userId === currentUserId) {
      document.getElementById('bNavProfile').classList.add('active');
    }

    renderProfileCard(user);
  }

  function canViewField(user, fieldPrivacyKey) {
    if (user.id === currentUserId) return true;
    const setting = (user.privacy && user.privacy[fieldPrivacyKey]) ? user.privacy[fieldPrivacyKey] : 'public';
    
    if (setting === 'public') return true;
    if (setting === 'members' && currentUserId) return true;
    return false;
  }

  function triggerCoverPhotoPicker() {
    document.getElementById('coverPhotoFileInput').click();
  }

  function triggerProfilePhotoPicker() {
    document.getElementById('profilePhotoFileInput').click();
  }

  function openPhotoModal(type) {
    const modal = document.getElementById('photoActionModal');
    const title = document.getElementById('modalTitle');
    const changeBtn = document.getElementById('modalChangeBtn');
    const removeBtn = document.getElementById('modalRemoveBtn');
    const changeLabel = document.getElementById('modalChangeLabel');
    const removeLabel = document.getElementById('modalRemoveLabel');

    if (type === 'cover') {
      title.textContent = "Cover Photo Options";
      changeLabel.textContent = "Change Cover Photo";
      removeLabel.textContent = "Remove Cover Photo";
      changeBtn.onclick = () => { closePhotoModal(); triggerCoverPhotoPicker(); };
      removeBtn.onclick = () => { closePhotoModal(); removeCoverPhoto(); };
    } else if (type === 'profile') {
      title.textContent = "Profile Photo Options";
      changeLabel.textContent = "Change Profile Photo";
      removeLabel.textContent = "Remove Profile Photo";
      changeBtn.onclick = () => { closePhotoModal(); triggerProfilePhotoPicker(); };
      removeBtn.onclick = () => { closePhotoModal(); removeProfilePhoto(); };
    }

    modal.classList.remove('hidden');
  }

  function closePhotoModal() {
    document.getElementById('photoActionModal').classList.add('hidden');
  }

  function removeCoverPhoto() {
    if (usersDb[currentUserId]) {
      usersDb[currentUserId].coverImg = "";
      saveDb();
      openProfile(currentUserId, false);
    }
  }

  function removeProfilePhoto() {
    if (usersDb[currentUserId]) {
      usersDb[currentUserId].avatarImg = "";
      saveDb();
      updateComposerAvatar();
      openProfile(currentUserId, false);
    }
  }

  function renderProfileCard(user) {
    const isOwner = (user.id === currentUserId);
    const initial = user.name.charAt(0).toUpperCase();

    let coverStyle = "";
    let coverContent = "";

            <div class="info-item">

            <div class="info-item">

            <div class="info-item">

          </div>
        </div>

        <div class="profile-section">
          <div class="profile-section-title"><i class="fa-solid fa-address-book"></i> Contact Details</div>
          <div class="info-grid">
            <div class="info-item">
              <div class="info-label">Phone Number</div>

            <div class="info-item">

      </div>
    `;

  function renderEditProfileForm(userId) {

        <h3 style="color: var(--bp-primary); font-size: 16px;">Edit Believers+ Profile</h3>
      </div>

      <form id="editProfileForm" class="card" onsubmit="saveProfileChanges(event, '${user.id}')">

        <div class="form-group">

        <div class="form-group">

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="editName" value="${user.name || ''}" required>
        </div>

          <label>Username</label>
          <input type="text" id="editUsername" value="${user.username || ''}" required>
        </div>

          <textarea id="editBio" rows="2">${user.bio || ''}</textarea>

        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="editDob" value="${user.dob || ''}">
          <select id="privDob" class="privacy-select">
            <option value="public" ${privacy.dob==='public'?'selected':''}>Visibility: Public</option>
            <option value="members" ${privacy.dob==='members'?'selected':''}>Visibility: Members Only</option>
            <option value="only_me" ${privacy.dob==='only_me'?'selected':''}>Visibility: Only Me</option>
          </select>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <input type="text" id="editGender" value="${user.gender || ''}">
        </div>

        <div class="form-group">
          <label>Current Address</label>
          <input type="text" id="editAddress" value="${user.address || ''}">
          <select id="privAddress" class="privacy-select">
            <option value="public" ${privacy.address==='public'?'selected':''}>Visibility: Public</option>
            <option value="members" ${privacy.address==='members'?'selected':''}>Visibility: Members Only</option>
            <option value="only_me" ${privacy.address==='only_me'?'selected':''}>Visibility: Only Me</option>
          </select>
        </div>

        <div class="form-group">
          <label>City / Community</label>
          <input type="text" id="editCity" value="${user.city || ''}">
        </div>

        <div class="form-group">
          <label>Country</label>
          <input type="text" id="editCountry" value="${user.country || ''}">
        </div>

        <div class="form-group">
          <label>Marital Status</label>
          <select id="editMaritalStatus">
            <option value="Single" ${user.maritalStatus==='Single'?'selected':''}>Single</option>
            <option value="Married" ${user.maritalStatus==='Married'?'selected':''}>Married</option>
            <option value="Engaged" ${user.maritalStatus==='Engaged'?'selected':''}>Engaged</option>
          </select>
        </div>

        <div class="divider"></div>
        <div class="profile-section-title"><i class="fa-solid fa-address-book"></i> Contact Settings</div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" id="editPhone" value="${user.phone || ''}">
          <select id="privPhone" class="privacy-select">
            <option value="public" ${privacy.phone==='public'?'selected':''}>Visibility: Public</option>
            <option value="members" ${privacy.phone==='members'?'selected':''}>Visibility: Members Only</option>
            <option value="only_me" ${privacy.phone==='only_me'?'selected':''}>Visibility: Only Me</option>
          </select>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="editEmail" value="${user.email || ''}" required>
          <select id="privEmail" class="privacy-select">
            <option value="public" ${privacy.email==='public'?'selected':''}>Visibility: Public</option>
            <option value="members" ${privacy.email==='members'?'selected':''}>Visibility: Members Only</option>
            <option value="only_me" ${privacy.email==='only_me'?'selected':''}>Visibility: Only Me</option>
          </select>
        </div>

        <div class="divider"></div>
        <div class="profile-section-title"><i class="fa-solid fa-graduation-cap"></i> Education & Career</div>

        <div class="form-group">
          <label>Highest Education Level</label>
          <input type="text" id="editEducationLevel" value="${user.educationLevel || ''}">
          <select id="privEducation" class="privacy-select">
            <option value="public" ${privacy.education==='public'?'selected':''}>Visibility: Public</option>
            <option value="members" ${privacy.education==='members'?'selected':''}>Visibility: Members Only</option>
            <option value="only_me" ${privacy.education==='only_me'?'selected':''}>Visibility: Only Me</option>
          </select>
        </div>

        <div class="form-group">
          <label>Institution</label>
          <input type="text" id="editInstitution" value="${user.institution || ''}">
        </div>

        <div class="form-group">
          <label>Course / Program</label>
          <input type="text" id="editCourse" value="${user.course || ''}">
        </div>

        <div class="form-group">
          <label>Graduation Year</label>
          <input type="text" id="editGradYear" value="${user.gradYear || ''}">
        </div>

        <div class="form-group">
          <label>Occupation</label>
          <input type="text" id="editOccupation" value="${user.occupation || ''}">
          <select id="privEmployment" class="privacy-select">
            <option value="public" ${privacy.employment==='public'?'selected':''}>Visibility: Public</option>
            <option value="members" ${privacy.employment==='members'?'selected':''}>Visibility: Members Only</option>
            <option value="only_me" ${privacy.employment==='only_me'?'selected':''}>Visibility: Only Me</option>
          </select>

        </div>

        <div class="divider"></div>
        <div class="profile-section-title"><i class="fa-solid fa-church"></i> Church & Ministry</div>

        <div class="form-group">
          <label>Home Church / Ministry</label>
          <input type="text" id="editChurch" value="${user.church || ''}">

            <option value="members" ${privacy.church==='members'?'selected':''}>Visibility: Members Only</option>

        <div class="form-group">
          <label>Department</label>
          <input type="text" id="editDepartment" value="${user.department || ''}">
        </div>

        <div class="form-group">

        </div>

        <div class="form-group">
          <label>Years of Service</label>
          <input type="text" id="editYearsService" value="${user.yearsService || ''}">
        </div>

        <div style="margin-top: 16px;">
          <button type="submit" class="btn btn-gold"><i class="fa-solid fa-floppy-disk"></i> Save Profile</button>
        </div>

      </form>
    `;
  }

  function saveProfileChanges(e, userId) {
    e.preventDefault();

    const user = usersDb[userId];
    if (!user) return;

    user.avatarImg = document.getElementById('editAvatarImg').value.trim();
    user.coverImg = document.getElementById('editCoverImg').value.trim();
    user.name = document.getElementById('editName').value.trim();
    user.username = document.getElementById('editUsername').value.trim();
    user.bio = document.getElementById('editBio').value.trim();
    user.dob = document.getElementById('editDob').value;
    user.gender = document.getElementById('editGender').value.trim();
    user.address = document.getElementById('editAddress').value.trim();
    user.city = document.getElementById('editCity').value.trim();
    user.country = document.getElementById('editCountry').value.trim();
    user.maritalStatus = document.getElementById('editMaritalStatus').value;
    user.phone = document.getElementById('editPhone').value.trim();
    user.email = document.getElementById('editEmail').value.trim();
    user.educationLevel = document.getElementById('editEducationLevel').value.trim();
    user.institution = document.getElementById('editInstitution').value.trim();
    user.course = document.getElementById('editCourse').value.trim();
    user.gradYear = document.getElementById('editGradYear').value.trim();
    user.occupation = document.getElementById('editOccupation').value.trim();
    user.employer = document.getElementById('editEmployer').value.trim();
    user.position = document.getElementById('editPosition').value.trim();
    user.skills = document.getElementById('editSkills').value.trim();
    user.church = document.getElementById('editChurch').value.trim();
    user.department = document.getElementById('editDepartment').value.trim();
    user.churchRole = document.getElementById('editChurchRole').value.trim();
    user.yearsService = document.getElementById('editYearsService').value.trim();

    user.privacy = {
      dob: document.getElementById('privDob').value,
      address: document.getElementById('privAddress').value,
      phone: document.getElementById('privPhone').value,
      email: document.getElementById('privEmail').value,
      education: document.getElementById('privEducation').value,
      employment: document.getElementById('privEmployment').value,
      church: document.getElementById('privChurch').value
    };

    saveDb();

    updateComposerAvatar();
    openProfile(userId, false);
  }
</script>
